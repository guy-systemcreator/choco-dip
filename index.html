<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>チョコディップ工房</title>
<meta name="description" content="長押しでひたして、はなしてすくう。チョコの泉でボスをたおし、全国ランキング1位を目指すスマホゲーム。">
<meta property="og:title" content="チョコディップ工房">
<meta property="og:description" content="長押しでひたして、はなしてすくう。ボスをたおして全国ランキング1位を目指せ。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3A1A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="チョコディップ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
html{box-sizing:border-box;height:100%}
body{margin:0;font-size:14px}
img{max-width:100%}[hidden]{display:none!important}
/* 画面構成：ゲーム画面は全面。上に数字の帯、下にタブ。パネルはクリーム色の紙で読みやすく */
:root{
  --choco:#3A1A0C; --choco-2:#5A2A14; --ink:#3A1A0C; --cream:#FFF6E6; --cream-2:#F7E6C8; --paper-line:#E8CFA4;
  --gold:#FFC93C; --gold-deep:#E08A12; --red:#E8323C; --red-deep:#A8121C; --leaf:#2E6A2A; --sky:#2F9BFF;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#0E1A10;color:#fff;font-family:var(--f-ui);font-weight:800;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
#root{height:100%}
button,input{font-family:var(--f-ui)}
button{cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.game{position:fixed;left:0;right:0;top:0;height:100vh;height:var(--appH,100svh);overflow:hidden;max-width:560px;margin:0 auto;background:#0E1A10}
.stage{position:absolute;inset:0;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 縁取り文字（ゲームの見出し・数字） */
.outl{color:#fff;text-shadow:0 3px 0 rgba(58,26,12,.9),2px 0 0 var(--choco),-2px 0 0 var(--choco),0 2px 0 var(--choco),0 -2px 0 var(--choco),2px 2px 0 var(--choco),-2px 2px 0 var(--choco),2px -2px 0 var(--choco),-2px -2px 0 var(--choco)}

/* 飴玉のような立体ボタン */
.cbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:22px;padding:14px 18px 16px;
  font-size:26px;font-weight:900;letter-spacing:.04em;color:#fff;
  background:linear-gradient(180deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%);
  box-shadow:0 6px 0 var(--b4),0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12);
  transition:transform .08s,box-shadow .08s}
.cbtn::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:42%;border-radius:16px 16px 40px 40px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.cbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--b4),0 4px 8px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.45)}
.cbtn > *{position:relative}
.cbtn .main{text-shadow:0 3px 0 var(--b5,var(--b4)),2px 0 0 var(--b5,var(--b4)),-2px 0 0 var(--b5,var(--b4)),0 -2px 0 var(--b5,var(--b4)),0 2px 0 var(--b5,var(--b4)),2px 2px 0 var(--b5,var(--b4)),-2px 2px 0 var(--b5,var(--b4)),2px -2px 0 var(--b5,var(--b4)),-2px -2px 0 var(--b5,var(--b4))}
.cbtn small{font-size:12.5px;font-weight:800;letter-spacing:.02em;opacity:.95;text-shadow:0 1px 0 var(--b4)}
.cbtn.yellow{--b1:#FFE66B;--b2:#FFC21E;--b3:#FF9A0E;--b4:#B4580A;--b5:#8A3A04}
.cbtn.red{--b1:#FF8A7A;--b2:#F0404A;--b3:#C81E2C;--b4:#7E0A16}
.cbtn.blue{--b1:#7FD3FF;--b2:#2F9BFF;--b3:#1C6FDA;--b4:#0C3F8E}
.cbtn.green{--b1:#B8F06A;--b2:#5CCB2E;--b3:#2E9A1C;--b4:#1A5E10}
.cbtn.sm{font-size:16px;padding:10px 14px 12px;border-radius:16px;box-shadow:0 4px 0 var(--b4),0 6px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.55)}
.cbtn.sm::before{top:3px;border-radius:12px 12px 30px 30px}
.cbtn.sm:active{transform:translateY(3px)}
.badge-new{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:900;border-radius:99px;padding:3px 8px;box-shadow:0 2px 0 var(--red-deep),0 0 0 2px #fff}

/* 丸いアイコンボタン */
.ibtn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(180deg,#7A4A2A,#4A2412);box-shadow:0 4px 0 #2A1006,0 6px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,180,.35)}
.ibtn img{width:32px;height:32px}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #2A1006,inset 0 2px 0 rgba(255,220,180,.3)}

/* ホーム */
.home{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(8,20,10,.55) 0%,rgba(8,20,10,0) 22%,rgba(8,20,10,0) 55%,rgba(20,8,4,.55) 100%)}
.topbar{display:flex;align-items:center;gap:8px}
.lvchip{display:flex;align-items:center;gap:0;flex:1;min-width:0}
.lvbadge{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFF2A8,#FFC21E 45%,#D8820E 100%);box-shadow:0 3px 0 #8A4A06,0 0 0 3px #fff,0 5px 10px rgba(0,0,0,.35)}
.lvbadge b{font-size:21px;font-weight:900;color:#fff;text-shadow:0 2px 0 #8A4A06,1px 0 0 #8A4A06,-1px 0 0 #8A4A06,0 -1px 0 #8A4A06}
.lvbadge small{position:absolute;top:-6px;font-size:9px;font-weight:900;color:#8A4A06;background:#fff;border-radius:99px;padding:1px 5px}
.xpwrap{flex:1;min-width:0;margin-left:-14px;height:30px;border-radius:0 99px 99px 0;background:rgba(30,12,6,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.18);
  display:flex;align-items:center;padding:0 10px 0 20px;position:relative;overflow:hidden}
.xpwrap i{position:absolute;left:14px;top:5px;bottom:5px;border-radius:99px;background:linear-gradient(180deg,#B8F06A,#4CB82A);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.xpwrap span{position:relative;font-size:12px;font-weight:900;margin-left:auto}
.chip{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 6px;border-radius:99px;background:rgba(30,12,6,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.18);font-size:15px;font-weight:900;white-space:nowrap}
.chip img{width:26px;height:26px}
.logo{display:block;width:min(86%,400px);margin:16px auto 0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
.tagline{text-align:center;font-size:14px;font-weight:900;margin-top:4px;letter-spacing:.06em}
.homespace{flex:1}
.actions{display:flex;flex-direction:column;gap:14px;padding:0 6px 14px}
.actions .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bestline{text-align:center;font-size:13px;font-weight:900;opacity:.95}
.bestline b{color:var(--gold);font-size:16px}

/* 下のタブ */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 -14px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:linear-gradient(180deg,#6A3A1E,#3E1C0C);box-shadow:0 -3px 0 rgba(255,210,160,.25),0 -10px 24px rgba(0,0,0,.35);border-radius:22px 22px 0 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;border-radius:14px;font-size:11.5px;font-weight:900;color:#F7E6C8}
.tab img{width:38px;height:38px;transition:transform .15s}
.tab.on{background:linear-gradient(180deg,rgba(255,201,60,.35),rgba(255,201,60,.08));color:#fff}
.tab.on img{transform:translateY(-4px) scale(1.12)}
.tab:active img{transform:scale(.92)}

/* パネル（紙） */
.sheetbg{position:absolute;inset:0;z-index:20;background:rgba(10,4,2,.55);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-height:88%;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);border-radius:26px 26px 0 0;
  box-shadow:0 -6px 0 var(--paper-line),0 -16px 40px rgba(0,0,0,.4);animation:up .28s cubic-bezier(.2,.9,.25,1.1);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(60%)}}
.sheet.center{margin:auto 14px;border-radius:26px;max-height:92%;box-shadow:0 8px 0 var(--paper-line),0 20px 50px rgba(0,0,0,.5)}
.sheethead{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 56px 10px}
.ribbon{position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 26px 10px;font-size:20px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#FF6A5A,#D8202A);border-radius:12px;box-shadow:0 4px 0 #7E0A16,inset 0 2px 0 rgba(255,255,255,.45);
  text-shadow:0 2px 0 #7E0A16}
.ribbon img{width:30px;height:30px;margin:-6px 0}
.close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#FF8A7A,#D8202A);box-shadow:0 3px 0 #7E0A16,inset 0 2px 0 rgba(255,255,255,.5);
  color:#fff;font-size:22px;font-weight:900;display:grid;place-items:center;text-shadow:0 2px 0 #7E0A16}
.sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--cream-2);box-shadow:inset 0 2px 3px rgba(90,42,20,.18)}
.seg button{padding:9px 2px;border-radius:10px;font-size:13px;font-weight:900;color:#8A5A3A}
.seg button.on{background:linear-gradient(180deg,#FFE66B,#FFB21E);color:#5A2A08;box-shadow:0 2px 0 #B4580A}
.note{font-size:13px;font-weight:700;line-height:1.6;color:#7A4A2A;margin:0}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rlist li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--paper-line)}
.rlist li.me{background:linear-gradient(180deg,#FFF4C2,#FFE07A);box-shadow:0 3px 0 #E0A82A}
.pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:900;color:#fff;background:#C9A57A;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.rlist li:nth-child(1) .pos{background:radial-gradient(circle at 35% 30%,#FFF2A8,#FFC21E 50%,#D8820E);box-shadow:0 2px 0 #8A4A06}
.rlist li:nth-child(2) .pos{background:radial-gradient(circle at 35% 30%,#fff,#C8D2DA 50%,#8A98A4);box-shadow:0 2px 0 #5A6874}
.rlist li:nth-child(3) .pos{background:radial-gradient(circle at 35% 30%,#FFD8B0,#E0904A 50%,#A85A22);box-shadow:0 2px 0 #6A3410}
.nm{min-width:0;font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font-size:11.5px;font-weight:700;color:#9A6A4A}
.sc{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--choco-2)}
.empty{font-size:14px;font-weight:800;color:#9A6A4A;text-align:center;padding:18px 0}
.mypos{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:900;padding:10px;border-radius:14px;background:var(--cream-2)}
.mypos b{font-size:22px;color:var(--red-deep)}

.achtop{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--paper-line)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--gold-deep) calc(var(--p)*1%),var(--cream-2) 0)}
.ring b{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--choco-2)}
.achtop .t{font-size:17px;font-weight:900}
.achtop .s{font-size:12.5px;font-weight:700;color:#9A6A4A}
.cat{font-size:14px;font-weight:900;color:var(--red-deep);margin:6px 2px 0;display:flex;align-items:center;gap:6px}
.cat::after{content:"";flex:1;height:2px;background:var(--paper-line);border-radius:2px}
.alist{display:flex;flex-direction:column;gap:7px}
.arow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--paper-line)}
.arow img{width:40px;height:40px}
.arow.lock img{filter:grayscale(1) opacity(.45)}
.arow .an{font-size:14.5px;font-weight:900;min-width:0}
.arow .ad{font-size:12px;font-weight:700;color:#9A6A4A;margin-top:1px}
.arow .ap{font-size:12px;font-weight:900;color:#9A6A4A;font-variant-numeric:tabular-nums;white-space:nowrap}
.arow .ap.ok{color:#2E9A1C}
.pbar{height:8px;border-radius:99px;background:var(--cream-2);overflow:hidden;margin-top:5px;box-shadow:inset 0 1px 2px rgba(90,42,20,.2)}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,#FFE66B,#FF9A0E)}
.arow.new{background:linear-gradient(180deg,#FFF8D6,#FFEFAE)}
.bossgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bosscard{border-radius:18px;background:linear-gradient(180deg,#5A2A14,#2A1006);padding:10px;text-align:center;color:#fff;box-shadow:0 3px 0 #1A0804}
.bosscard img{width:86px;height:106px;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.bosscard.lock img{filter:brightness(0) opacity(.6)}
.bosscard b{display:block;font-size:14px}
.bosscard span{font-size:11px;font-weight:700;opacity:.85;line-height:1.4;display:block}

.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fcard{position:relative;border-radius:18px;background:#fff;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--paper-line);color:var(--ink)}
.fcard.on{background:linear-gradient(180deg,#FFF4C2,#FFE07A);box-shadow:0 3px 0 #E0A82A,0 0 0 3px #FFB21E}
.fcard b{font-size:14px}
.fcard span{font-size:11px;font-weight:800;color:#9A6A4A}
.fcard.lock{opacity:.7}
.mini{position:relative;width:22px;height:110px;border-radius:11px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.25)}
.mini .bis{position:absolute;inset:0;background-size:100% 100%}
.mini .ct{position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:0 0 11px 11px}
.mini .ct::after{content:"";position:absolute;left:22%;width:18%;top:8%;bottom:10%;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0))}
.lockmark{position:absolute;top:8px;right:8px;font-size:11px;font-weight:900;color:#fff;background:#9A6A4A;border-radius:99px;padding:2px 7px}
.check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#2E9A1C;color:#fff;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 #1A5E10}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:900;color:#7A4A2A}
.field input{border:0;border-radius:14px;padding:13px 14px;font-size:17px;font-weight:800;background:#fff;color:var(--ink);box-shadow:inset 0 2px 3px rgba(90,42,20,.2),0 0 0 2px var(--paper-line)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--paper-line);font-size:15px;font-weight:900}
.sw{width:58px;height:32px;border-radius:99px;background:#D8C4A4;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.2);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:#5CCB2E}
.sw.on::after{left:29px}
.howto{display:flex;flex-direction:column;gap:8px}
.howto div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--paper-line);font-size:13.5px;font-weight:800;line-height:1.5}
.howto b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#5A2A08;box-shadow:0 2px 0 #B4580A}

/* 遊ぶ画面の上の帯 */
.hud{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.hudrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hscore{display:flex;flex-direction:column;line-height:1}
.hscore small{font-size:11px;font-weight:900;color:#FFE9B0;letter-spacing:.1em}
.hscore b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.timer{--p:100;position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--tc,#FFC93C) calc(var(--p)*1%),rgba(30,12,6,.6) 0);box-shadow:0 0 0 3px rgba(30,12,6,.75),0 4px 10px rgba(0,0,0,.35)}
.timer b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#6A3A1E,#2A1006);font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.timer.warn{--tc:#FF4A4A;animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.hright{display:flex;justify-content:flex-end}
.hright .ibtn{pointer-events:auto;width:42px;height:42px}
.hright .ibtn img{width:28px;height:28px}
.hudrow2{display:flex;align-items:center;gap:8px}
.fever{flex:1;display:flex;align-items:center;height:26px;border-radius:99px;background:rgba(30,12,6,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.15);position:relative;padding-left:30px;overflow:hidden}
.fever img{position:absolute;left:2px;top:1px;width:24px;height:24px;z-index:1}
.fever i{position:absolute;left:24px;top:5px;bottom:5px;border-radius:99px;background:linear-gradient(180deg,#FFE66B,#FF7A1A);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transition:width .15s}
.fever.on i{background:linear-gradient(90deg,#FF5A5A,#FFB21E,#FFF16B,#5CE05A,#3AB0FF,#B05AFF);background-size:200% 100%;animation:rb .6s linear infinite}

function emptyStats(){ const s={}; STAT_SUM.forEach(k=>s[k]=0); STAT_MAX.forEach(k=>s[k]=0); STAT_SET.forEach(k=>s[k]=[]); return s; }
function mergeStats(a,b){ const s={}; STAT_SUM.forEach(k=>s[k]=(a[k]||0)+(b[k]||0)); STAT_MAX.forEach(k=>s[k]=Math.max(a[k]||0,b[k]||0));
  STAT_SET.forEach(k=>s[k]=[...new Set([...(a[k]||[]),...(b[k]||[])])]); return s; }
function rid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

let memStore=null;
function loadStore(){
  if(!memStore){
    memStore=defStore();
    try{
      const s=JSON.parse(localStorage.getItem('chocoDipStore3')||'null');
      if(s){ memStore=Object.assign(defStore(),s); memStore.stats=Object.assign(emptyStats(),s.stats||{}); }
      else { const o=JSON.parse(localStorage.getItem('chocoDipStore2')||'null'); if(o){ memStore.name=o.name||''; memStore.best=o.best||0; } }
    }catch(e){}
  }
  return JSON.parse(JSON.stringify(memStore));
}
function saveStore(s){ memStore=JSON.parse(JSON.stringify(s)); try{ localStorage.setItem('chocoDipStore3',JSON.stringify(s)); }catch(e){} }
function dayKey(d=new Date()){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function weekKey(d0=new Date()){ const d=new Date(Date.UTC(d0.getFullYear(),d0.getMonth(),d0.getDate())); const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const y=d.getUTCFullYear(), w=Math.ceil(((d-Date.UTC(y,0,1))/86400000+1)/7); return y+String(w).padStart(2,'0'); }
function yesterdayKey(){ const d=new Date(); d.setDate(d.getDate()-1); return dayKey(d); }

function todayMissions(d=dayKey()){ const r=mulberry(+d*31+7), used=new Set(); return [0,1,2].map(t=>{ let c=MIS_POOL.filter(m=>m.tier===t&&!used.has(m.key)); if(!c.length) c=MIS_POOL.filter(m=>m.tier===t); const m=c[Math.floor(r()*c.length)%c.length]; used.add(m.key); return m; }); }
function misState(s){ const d=dayKey(); if(!s.mis||s.mis.day!==d) return {day:d,prog:{},claimed:[],bonus:false}; return {bonus:false,...s.mis,prog:{...s.mis.prog},claimed:[...(s.mis.claimed||[])]}; }
// 1回のゲーム中の値（run＋今の点数）から、その日の進み具合を計算する
function misRunVal(m,run,score,done){ if(m.key==='score') return score||0; if(m.key==='noMiss') return (run.miss===0&&done>=20)?1:0; if(m.key==='games') return run.games||0; return run[m.key]||0; }
function misVal(m,prog,run,score,done){ const saved=prog[m.id]||0, v=run?misRunVal(m,run,score,done):0; return m.mode==='sum'?saved+v:Math.max(saved,v); }
function misClaimable(s){ const st=misState(s); return todayMissions().filter(m=>(st.prog[m.id]||0)>=m.goal&&!st.claimed.includes(m.id)).length+(st.claimed.length>=3&&!st.bonus?1:0); }

function parseDuelHash(hash){ const m=/^#vs=([0-9a-z]+)\.([0-9a-z]+)\.(.*)$/.exec(hash||''); if(!m) return null;

const GACHA_COST=150, GACHA10_COST=1350, PITY_MAX=80;
function rollRarity(minSR){ if(minSR){ return Math.random()<0.05?'SSR':'SR'; } let t=Math.random()*100; for(const k of ['SSR','SR','R','N']){ t-=RARITY[k].rate; if(t<=0) return k; } return 'N'; }
// ガチャを引く（天井あり）。結果と、更新したデータを返す
function pullGacha(s,n){
  const out=[];
  for(let i=0;i<n;i++){
    s.pity=(s.pity||0)+1;
    let rar=rollRarity(n===10&&i===9&&!out.some(o=>o.rar==='SR'||o.rar==='SSR'));
    if(s.pity>=PITY_MAX) rar='SSR';
    if(rar==='SSR') s.pity=0;
    const pool=SKINS.filter(k=>k.rar===rar); const sk=pool[Math.random()*pool.length|0];
    const isNew=!(s.skins[sk.id]>0); s.skins[sk.id]=(s.skins[sk.id]||0)+1;
    const refund=isNew?0:RARITY[rar].refund; s.coins+=refund;
    out.push({...sk,isNew,refund});
    s.stats.gachaPulls=(s.stats.gachaPulls||0)+1; if(rar==='SSR') s.stats.ssrGet=(s.stats.ssrGet||0)+1;
  }
  s.stats.skinCount=Object.keys(s.skins).filter(k=>s.skins[k]>0).length;
  return out;
}

const Online = {
  enabled(){ return !!(RANK_CONFIG.projectId && RANK_CONFIG.apiKey); },
  base(){ return `https://firestore.googleapis.com/v1/projects/${RANK_CONFIG.projectId}/databases/(default)/documents`; },
  async req(url,opt){ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),8000);
    try{ const r=await fetch(url,{...opt,signal:ac.signal,headers:{'Content-Type':'application/json'}}); if(!r.ok) throw new Error('http '+r.status); return await r.json(); } finally{ clearTimeout(tm); } },
  async submit(coll,pid,d){
    const fields={ name:{stringValue:d.name.slice(0,12)}, score:{integerValue:String(d.score)}, lv:{integerValue:String(d.lv)}, combo:{integerValue:String(d.combo)}, ts:{integerValue:String(Date.now())} };
    return this.req(`${this.base()}/${coll}/${pid}?key=${RANK_CONFIG.apiKey}`,{method:'PATCH',body:JSON.stringify({fields})});
  },
  // シーズン開始前の記録と、消された記録（0点）は表示しない
  async raw(coll,n){
    const res=await this.req(`${this.base()}:runQuery?key=${RANK_CONFIG.apiKey}`,{method:'POST',body:JSON.stringify({structuredQuery:{from:[{collectionId:coll}],orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:n}})});
    return (res||[]).filter(x=>x.document).map(x=>{ const f=x.document.fields||{}; return { id:x.document.name.split('/').pop(), name:f.name?f.name.stringValue:'？', score:+(f.score&&f.score.integerValue||0), lv:+(f.lv&&f.lv.integerValue||1), combo:+(f.combo&&f.combo.integerValue||0), ts:+(f.ts&&f.ts.integerValue||0) }; });
  },
  live(x){ return x.score>0&&x.ts>=SEASON_TS; },
  async top(coll,n=50){ const l=await this.raw(coll,Math.max(150,n*3)); return l.filter(x=>this.live(x)).slice(0,n); },
  // 順位：シーズン前の記録は上位150件から数えて差し引く
  async place(coll,best){
    const [l,above,total]=await Promise.all([this.raw(coll,150),this.count(coll,best),this.count(coll,0)]);
    const old=l.filter(x=>!this.live(x)&&x.score>0);
    return { pos:Math.max(1,above-old.filter(x=>x.score>best).length+1), total:Math.max(1,total-old.length) };
  },
  async erase(pid){ const d={name:'（削除）',score:0,lv:1,combo:0}; return Promise.all(['all','week','daily'].map(p=>this.submit(COLL[p](),pid,d).catch(()=>null))); },
  async count(coll,above){
    const q={from:[{collectionId:coll}]};
    if(above!=null) q.where={fieldFilter:{field:{fieldPath:'score'},op:'GREATER_THAN',value:{integerValue:String(above)}}};
    const res=await this.req(`${this.base()}:runAggregationQuery?key=${RANK_CONFIG.apiKey}`,{method:'POST',body:JSON.stringify({structuredAggregationQuery:{structuredQuery:q,aggregations:[{alias:'c',count:{}}]}})});
    const r=res&&res[0]&&res[0].result; return r?+(r.aggregateFields.c.integerValue||0):0;
  },
};

// ルーレットの円盤（ゲーム中と、ホームの今日のルーレットで共通）
function drawWheel(ctx,cx,cy,R,items,ang,t,hi){
  const N=items.length, step=Math.PI*2/N;
  ctx.save();
  // タルト生地のふち
  ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=20; ctx.shadowOffsetY=8;
  const crust=ctx.createRadialGradient(cx-R*0.2,cy-R*0.2,R*0.6,cx,cy,R*1.16); crust.addColorStop(0,'#F4C47A'); crust.addColorStop(0.8,'#D89048'); crust.addColorStop(1,'#9A5A1E');
  ctx.fillStyle=crust; ctx.beginPath(); for(let i=0;i<=48;i++){ const a=i/48*Math.PI*2, rr_=R*1.13+(i%2?R*0.025:0); i?ctx.lineTo(cx+Math.cos(a)*rr_,cy+Math.sin(a)*rr_):ctx.moveTo(cx+Math.cos(a)*rr_,cy+Math.sin(a)*rr_); } ctx.closePath(); ctx.fill();
  ctx.shadowColor='transparent';
  ctx.fillStyle='rgba(120,60,20,.35)'; for(let i=0;i<40;i++){ const a=prand(i)*Math.PI*2, rr_=R*(1.04+prand(i+9)*0.07); ctx.fillRect(cx+Math.cos(a)*rr_,cy+Math.sin(a)*rr_,1.6,1.6); }
  ctx.fillStyle='#3A1A0C'; ctx.beginPath(); ctx.arc(cx,cy,R*1.02,0,Math.PI*2); ctx.fill();
  // 中身（チョコとフルーツのつやがけ）
  for(let i=0;i<N;i++){
    const a0=ang+i*step, a1=a0+step;
    const g=ctx.createRadialGradient(cx,cy,R*0.15,cx,cy,R); g.addColorStop(0,tone(items[i].col,1.25)); g.addColorStop(0.75,tone(items[i].col,0.95)); g.addColorStop(1,tone(items[i].col,0.65));
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath(); ctx.fill();
    if(hi===i){ ctx.fillStyle=`rgba(255,255,255,${0.3+0.25*Math.sin(t*14)})`; ctx.fill(); }
    ctx.strokeStyle='rgba(58,26,12,.8)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a0)*R,cy+Math.sin(a0)*R); ctx.stroke();
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(a0+step/2);
    const fs=Math.max(10,Math.min(R*0.15,R*1.1/Math.max(3,items[i].lab.length)));
    ctx.font=`900 ${fs}px ${FONT_UI}`; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.lineJoin='round';
    ctx.lineWidth=fs*0.28; ctx.strokeStyle='rgba(40,10,4,.85)'; ctx.strokeText(items[i].lab,R*0.9,0); ctx.fillStyle='#fff'; ctx.fillText(items[i].lab,R*0.9,0);
    ctx.restore();
  }
  ctx.fillStyle='rgba(255,255,255,.14)'; ctx.beginPath(); ctx.ellipse(cx-R*0.3,cy-R*0.45,R*0.45,R*0.18,-0.5,0,Math.PI*2); ctx.fill();
  // 中心のトリュフ
  ctx.save(); ctx.translate(cx,cy); drawTruffle(ctx,4,R*0.19,t); ctx.restore();
  // 針：チョコをかけたスティック
  ctx.save(); ctx.translate(cx,cy-R*0.86); ctx.rotate(Math.PI); drawStick(ctx,R*0.42,Math.max(8,R*0.1),0.45,'normal',null,t,1,FLAVORS[0],1,'plain'); ctx.restore();
  ctx.restore();
}

function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const ease=t=>1-Math.pow(1-t,3);
const mod5=x=>((Math.floor(x)%5)+5)%5;
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function tone(h,f,a=1){ const c=hexRgb(h).map(v=>Math.max(0,Math.min(255,Math.round(f>=1?v+(255-v)*(f-1):v*f)))); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

  /* ---------- トリュフくじ（在庫つき） ---------- */
  addHold(pWin){
    if(!this.running||this.tut) return;

    const win=Math.random()<pWin;
    const r=Math.random(), col=win?(r<0.2?'rainbow':(r<0.75?'gold':'normal')):(r<0.12?'gold':'normal');

  holdRank(c){ return ['normal','gold','rainbow'].indexOf(c); }
  updHolds(dt){
    for(const h_ of this.holds){
      const rk=this.holdRank(h_.col);
      if(h_.win&&rk<2&&Math.random()<dt*0.12){ h_.col=['normal','gold','rainbow'][rk+1]; h_.glow=1; this.run.holdChanges++; Snd.kyuin(); }
      if(h_.glow) h_.glow=Math.max(0,h_.glow-dt*1.5);
    }
    if(!this.slot&&this.holds.length&&!this.paused()&&this.running&&this.startDelay<=0){ this.startSpin(this.holds.shift()); }
  }
  startSpin(h_){
    const rk=this.holdRank(h_.col), win=h_.win;
    const reach=win||Math.random()<[0.3,0.7,1][rk];
    const sup=reach&&Math.random()<(win?0.5:0.2);
    let r;
    if(win){ const s=(rk>=1&&Math.random()<0.6)?4:(Math.random()*5|0); r=[s,s,s]; }
    else if(reach){ const s=Math.random()*5|0; r=[s,s,(s+(Math.random()<0.5?1:4))%5]; }
    else { const a=Math.random()*5|0, b=(a+1+(Math.random()*4|0))%5; r=[a,b,Math.random()*5|0]; }
    this.slot={r,win,reach,sup,col:h_.col,t:0,stops:[0.45,0.75,reach?(sup?2.4:1.5):1.0],stopped:[false,false,false],off:[Math.random()*5,Math.random()*5,Math.random()*5],done:false,doneT:0};
    this.run.slotSpins++;
  }
  updSlot(dt){
    const S=this.slot; if(!S) return;
    S.t+=dt; let spinning=false;
    for(let i=0;i<3;i++){
      if(S.stopped[i]) continue;
      const stop=S.stops[i], land=(S.reach&&i===2)?0.6:0.22, rem=stop-S.t;
      if(rem<=0){ S.stopped[i]=true; S.off[i]=S.r[i]; Snd.slotStop(i);
        if(i===1&&S.reach){ if(S.sup) this.run.superReach++; Snd.reach(Math.min(1.2,S.stops[2]-S.stops[1])); }
        continue; }
      spinning=true;
      if(rem<land){ const k=rem/land; S.off[i]=S.r[i]-k*k*1.5; }
      else { const slow=(S.reach&&i===2&&S.t>S.stops[1]); S.off[i]+=(slow?Math.max(4,12-(S.t-S.stops[1])*6):12)*dt; }
    }

    if(!spinning && !S.done){

        this.run.jackpots++; Snd.jackpot(); this.coinBurst(30); haptic([40,40,80]);

      }

  }

  /* ---------- ルーレット ---------- */
  startRoulette(reason){
    if(this.running&&!this.stickIdle()&&(this.roulWait=(this.roulWait||0)+1)<40){ this.later(0.15,()=>this.startRoulette(reason)); return; } this.roulWait=0;
    if(!this.running||this.roul||(this.roulCount||0)>=2) return; this.roulCount=(this.roulCount||0)+1;
    const tot=ROULETTE.reduce((a,b)=>a+b.w,0); let t=Math.random()*tot, idx=0;
    for(let i=0;i<ROULETTE.length;i++){ t-=ROULETTE[i].w; if(t<=0){ idx=i; break; } }
    const N=ROULETTE.length, step=Math.PI*2/N, top=ROULETTE.length-1;
    // おしい演出：大当たりの隣に止まりやすい
    if(idx!==top&&Math.random()<0.35) idx=Math.random()<0.5?top-1:0;
    const a0=this.roulAng||0, want=-Math.PI/2-(idx+0.5)*step+(Math.random()-0.5)*step*0.6;
    let delta=((want-a0)%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
    if(idx===0||idx===top-1) delta+=(idx===0?-1:1)*step*0.36;
    this.roul={reason,idx,a0,a1:a0+Math.PI*2*4+delta,t:0,dur:2.3,state:'spin',lastSlice:-1,showT:0};
    this.holding=false; this.run.roulettes++;

  }
  updRoulette(dt){
    const R=this.roul; if(!R) return;

      R.t+=dt; const k=Math.min(1,R.t/R.dur), e=1-Math.pow(1-k,4);
      this.roulAng=R.a0+(R.a1-R.a0)*e;
      const N=ROULETTE.length, step=Math.PI*2/N;
      const sl=Math.floor((((-Math.PI/2-this.roulAng)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)/step);
      if(sl!==R.lastSlice){ R.lastSlice=sl; Snd.note(1200+k*900,{type:'square',dur:0.03,vol:0.05,wet:0.1}); haptic(5); }
      if(k>=1){ R.state='show'; this.applyPrize(R.idx); }
    } else { R.showT+=dt; if(R.showT>0.8) this.roul=null; }
  }
  applyPrize(i){

  /* ---------- ボス ---------- */
  chooseBoss(){
    const prog=this.prog, pool=[...Array(prog).keys()], k=this.encounters;
    const ev=eventBoss();
    if(!this.eventDone&&k>=1&&Math.random()<0.22) return {def:ev,isEvent:true,hpMul:1+0.05*k};
    const lvNow=levelInfo(this.store.xp||0).lv;
    const newAvail=prog<BOSSES.length&&this.newKills<1&&lvNow>=BOSS_LV[prog];
    const pNew=this.newEscapes>0?0.25:0.45;
    if(newAvail&&(pool.length===0||this.sinceNew>=3||Math.random()<pNew)) return {def:BOSSES[prog],isNew:true,hpMul:1.2};
    if(pool.length){
      let cand=pool.filter(i=>BOSSES[i].type!==this.lastBossType); if(!cand.length) cand=pool;
      const i=cand[Math.random()*cand.length|0];
      if(prog>=BOSSES.length&&Math.random()<0.2) return {def:BOSSES[BOSSES.length-1],enh:true,hpMul:1.4+0.05*k};
      return {def:BOSSES[i],hpMul:1+0.06*k};
    }
    return {def:ev,isEvent:true,hpMul:1};
  }
  spawnBoss(){
    const pl=this.chooseBoss(), def=pl.def;
    const hp=Math.round(def.hp*pl.hpMul);
    this.encounters++; this.sinceNew=pl.isNew?0:this.sinceNew+1; this.lastBossType=def.type;

  endBoss(defeated){

    if(defeated){
      const bp0=this.bossPos(); b.state='down'; b.downT=0; b.cx=bp0.x; b.cy=bp0.y; b.size=bp0.size;
      b.frags=Array.from({length:8},(_,i)=>{ const a=(i+0.5)/8*Math.PI*2; return {a0:i/8*Math.PI*2,a1:(i+1)/8*Math.PI*2,x:0,y:0,vx:Math.cos(a)*(260+Math.random()*220),vy:Math.sin(a)*(200+Math.random()*160)-320,rot:0,vr:(Math.random()-0.5)*9}; });
      this.crown(bp0.x,bp0.y,60,1.6); this.shocks=(this.shocks||[]); this.shocks.push({x:bp0.x,y:bp0.y,t:0,air:true}); this.shocks.push({x:bp0.x,y:bp0.y,t:-0.12,air:true});
      this.stamp={t:0,x:bp0.x,y:bp0.y-bp0.size*0.1};

      if(b.plan.isEvent){ this.eventDone=true; this.run.eventKills++; if(!this.run.eventTypes.includes(b.def.type)) this.run.eventTypes.push(b.def.type); }
      else if(!this.run.bossTypes.includes(b.def.type)) this.run.bossTypes.push(b.def.type);
      if(b.t<6) this.run.quickKills++;
      { const lg=this.blog[b.def.type]||(this.blog[b.def.type]={k:0,met:1,esc:0,fast:null}); lg.k++; lg.fast=lg.fast==null?b.t:Math.min(lg.fast,b.t); }
      if(this.fever>0) this.run.feverKills++;
      if(b.plan.isNew){ this.run.newBossDefeated=true; this.newKills++; this.newEscapes=0; this.prog=Math.min(BOSSES.length,this.prog+1); }
      const bonus=Math.round(b.def.bonus*(b.plan.enh?1.5:1));

      const sub=`+${fmtN(bonus)}点`+(bt>0?` ＋${bt}秒`:'')+(b.plan.isNew?'・図鑑に登録':'')+(b.plan.isEvent?`・コイン+${b.def.coins}`:'');
      this.banner(b.def.name+' 撃破！',sub,true,b.plan.isNew||b.plan.isEvent?'rainbow':null,'boss');
      this.coinBurst(b.plan.isEvent?80:46); this.confetti(b.plan.isEvent?90:40); this.shake=16; this.flash=1; this.flashCol='255,240,190'; haptic([80,50,80,50,160]);
      Snd.shatter(); this.later(0.25,()=>Snd.bossDown());

      this.later(1.5,()=>this.startRoulette(b.plan.isEvent?'イベントボス撃破ボーナス':'ボス撃破ボーナス'));
      if(this.gauge>=1) this.later(1.2,()=>this.startFever());

  bossLanded(b){

    const pl=b.plan; this.plate={def:b.def,t:0,label:pl.isEvent?'イベントボス':(pl.isNew?'新ボス':(pl.enh?'強化ボス':'ボス')),rainbow:pl.isEvent||pl.isNew};
    Snd.bossLand(); haptic([90,40,140]);

  finishBoss(){
    const b=this.boss; if(!b||b.state!=='fight') return;
    b.state='finish'; b.ft=0; this.slowmo={t:0,dur:0.6};
    const bp=this.bossPos(); this.flash=0.45; this.flashCol='255,250,230'; this.shake=10;
    this.popup('とどめ！',this.W/2,this.bannerY(),'#FFD166',46,1.0);

  updBoss(dt){
    const b=this.boss;
    if(!b){
      if(this.running&&this.startDelay<=0&&!this.roul&&this.elapsed>=this.nextBossAt&&this.time>8&&this.stickIdle()) this.spawnBoss();
      this.darkA+=(0-this.darkA)*Math.min(1,dt*6);
      return;
    }
    b.hitT=Math.max(0,b.hitT-dt); b.shk=Math.max(0,b.shk-dt*30);
    if(this.roul&&b.state==='fight') return;
    b.t+=dt;
    b.sq=Math.max(0,(b.sq||0)-dt*2.6);
    if(b.state==='warn'){ b.st+=dt; if(b.st>=0.6){ b.state='fall'; b.st=0; Snd.whoosh(); } }
    else if(b.state==='fall'){ b.st+=dt; if(b.st>=0.25){ b.state='fight'; b.st=0; b.t=0; this.bossLanded(b); } }
    else if(b.state==='finish'){ b.ft=(b.ft||0)+dt; }
    else if(b.state==='fight'){
      if(this.ab('heal')) b.hp=Math.min(b.max,b.hp+dt*0.5);
      if(b.t>=b.dur||!this.running) this.endBoss(false);
    }
    else { b.downT+=dt; if(b.frags) for(const f of b.frags){ f.vy+=900*dt; f.x+=f.vx*dt; f.y+=f.vy*dt; f.rot+=f.vr*dt; } if(b.downT>1.5){ this.boss=null; } }
    const dark=this.ab('blink')&&(b.t%3.4)>2.2;
    this.darkA+=((dark?0.9:0)-this.darkA)*Math.min(1,dt*6);
  }

  /* ---------- 判定 ---------- */
  evaluate(){
    const s=this.stick, G=this.g;
    if(!this.running){ s.coat=0; s.phase='ready'; return; }
    const c=s.coat, tg=s.target, d=Math.abs(c-tg); this.mLast={coat:c,target:tg,t:0};
    const pw=this.ab('shrink')?0.018:0.03, gw=this.ab('shrink')?0.055:0.08;
    let res,label;
    if(c>=0.985){ res='miss'; label='持ち手がない！'; }
    else if(d<=pw){ res='perfect'; label='パーフェクト！'; }
    else if(d<=gw){ res='good'; label='グッド'; }
    else { res='miss'; label=c<tg?'うすづけ…':'つけすぎ…'; }
    this.run[res]++; this.done++; this.judges.push(res);
    const mult=(s.type==='thin'?2:s.type==='gold'?3:1)*this.mult();
    const JX=this.W/2, JY=this.jy(), w=s.type==='thin'?G.w*0.62:G.w;
    const fighting=this.boss&&this.boss.state==='fight';
    if(res==='miss'){
      if(this.combo>=5) this.popup(this.combo+'コンボ ストップ',JX,JY+62,'#FFB4A0',16,1);

    const misNew=this.misDefs.filter(m=>(misBefore[m.id]||0)<m.goal&&mis.prog[m.id]>=m.goal).map(m=>m.id);

      else if(!this.ab('move')&&s.phase==='ready') s.target+=(s.baseT-s.target)*Math.min(1,dt*4);
      let want=1;

        if(s.drips>0&&s.phase==='up'&&sub<0){ s.dripT-=dt; if(s.dripT<=0){ s.drips--; s.dripT=0.22; const tip=G.restBottom+s.pos; this.particles.push({blob:true,x:G.x+(Math.random()-0.5)*3,y:tip+2,vx:0,vy:30,life:2,r:2.2+Math.random()*1.6,col:s.type==='gold'?'#3A1A0C':this.fl.coat,grav:900}); } }

  }

  draw(){

          if(b.state==='fall'){ sx=0.9; sy2=1.12; }

        else { ctx.fillStyle='#2A1A3A'; ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-p.r*0.6,-p.r*0.8,-p.r*1.4,-p.r*0.2); ctx.quadraticCurveTo(-p.r*0.7,0,-p.r*0.5,p.r*0.3); ctx.quadraticCurveTo(0,0,p.r*0.5,p.r*0.3); ctx.quadraticCurveTo(p.r*0.7,0,p.r*1.4,-p.r*0.2); ctx.quadraticCurveTo(p.r*0.6,-p.r*0.8,0,0); ctx.fill(); }

    for(const f of this.flyers) if(f.kind==='fly'){

      ctx.fillStyle='#FFE9B0'; ctx.font=`900 10px ${FONT_UI}`; ctx.textAlign='center'; ctx.textBaseline='middle';

    if(this.darkA>0.01){ ctx.save(); const cx=G.x, cy=G.restBottom-G.L*0.35;

<script>
/* ================= 画面（React） ================= */
const { useState, useEffect, useRef } = React;
// 実際に見えている画面の高さを測る（Safariの下のバーに隠れないように）
(function(){
  let probe=null;
  const svh=()=>{ try{ if(!probe){ probe=document.createElement('div'); probe.style.cssText='position:fixed;left:0;top:0;width:1px;height:100vh;height:100svh;visibility:hidden;pointer-events:none;z-index:-1'; document.body.appendChild(probe); } return probe.offsetHeight||1e9; }catch(e){ return 1e9; } };
  const set=()=>{ const vv=window.visualViewport, de=document.documentElement;
    const hh=Math.round(Math.min(window.innerHeight||1e9, vv?vv.height:1e9, de.clientHeight||1e9, svh()));
    if(!(hh>200&&hh<5000)) return;
    de.style.setProperty('--appH',hh+'px');
    de.setAttribute('data-h',[800,720,700,620].filter(x=>hh<=x).map(x=>'h'+x).join(' '));
    if(window.scrollY) window.scrollTo(0,0); };
  const later=()=>{ set(); setTimeout(set,120); setTimeout(set,500); };
  if(document.body) set(); else document.addEventListener('DOMContentLoaded',set);
  window.addEventListener('resize',later); window.addEventListener('orientationchange',()=>setTimeout(later,300)); window.addEventListener('pageshow',later);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) later(); });
  if(window.visualViewport) window.visualViewport.addEventListener('resize',later); setTimeout(set,500); setTimeout(set,1500); })();
const h = React.createElement;
const fmt=n=>Number(n||0).toLocaleString('ja-JP');
const Ic=(k,cls)=>h('img',{src:IMG_SRC['ic_'+k],alt:'',className:cls,draggable:false});

function Sheet({title,icon,onClose,children,center}){
  return h('div',{className:'sheetbg',onClick:e=>{ if(e.target===e.currentTarget) onClose(); }},
    h('div',{className:'sheet'+(center?' center':''),role:'dialog','aria-label':title},
      h('div',{className:'sheethead'},h('span',{className:'ribbon'},icon&&Ic(icon),title),h('button',{className:'close',onClick:onClose,'aria-label':'閉じる'},'×')),
      h('div',{className:'sheetbody'},children)));
}

function RankBody({store,initTab,refreshKey}){
  const online=Online.enabled();
  const [tab,setTab]=useState(initTab||(online?'daily':'local'));
  const [list,setList]=useState(null), [err,setErr]=useState('');
  useEffect(()=>{
    if(tab==='local'||!online){ setList([]); return; }
    let alive=true; setList(null); setErr('');
    Online.top(COLL[tab]()).then(l=>{ if(alive) setList(l); }).catch(()=>{ if(alive){ setErr('通信できませんでした。電波のよい場所でもう一度開いてください。'); setList([]); } });
    return ()=>{ alive=false; };
  },[tab,refreshKey]);
  const tabs=[['daily','今日のお題'],['week','今週'],['all','総合'],['local','この端末']];
  let body;
  if(tab==='local'){
    body=store.rank.length? h('ol',{className:'rlist'},store.rank.map((e,i)=>h('li',{key:e.id||i},h('span',{className:'pos'},i+1),h('span',{className:'nm'},e.name,h('small',null,e.date)),h('span',{className:'sc'},fmt(e.score)))))
      : h('p',{className:'empty'},'まだ記録がありません');
  } else if(!online) body=h('p',{className:'note'},'全国ランキングは準備中です。');
  else if(list===null) body=h('p',{className:'empty'},'読みこみ中…');
  else if(err) body=h('p',{className:'empty'},err);
  else if(!list.length) body=h('p',{className:'empty'},tab==='daily'?'今日はまだ誰も挑戦していません。一番乗りのチャンス！':'まだ記録がありません。最初の1位をとろう！');
  else body=h('ol',{className:'rlist'},list.map((e,i)=>h('li',{key:e.id,className:e.id===store.pid?'me':''},h('span',{className:'pos'},i+1),
      h('span',{className:'nm'},e.name,h('small',null,`レベル${e.lv}・最大${e.combo}コンボ`)),h('span',{className:'sc'},fmt(e.score)))));
  return h(React.Fragment,null,
    h('div',{className:'seg'},tabs.map(([k,l])=>h('button',{key:k,className:tab===k?'on':'',onClick:()=>setTab(k)},l))),
    tab==='daily'&&online&&h('p',{className:'note'},'今日のお題は全員が同じ順番のスティックで勝負。何回でも挑戦でき、いちばん良い記録が載ります。'),
    body);
}

const CAT_IC={'腕前':'medal','積み重ね':'box','特別スティック':'flavor','運とお祭り':'fire','ルーレット':'rank','ボス':'crown','イベント':'crown','ガチャ':'gacha','ともだち':'rank','つづける':'fire'};
function BossDetail({b,store,isEvent,onClose}){

      r.newAch.length>0&&h('p',{className:'cat'},`新しい実績 ${r.newAch.length}個`),
      r.newAch.length>0&&h('div',{className:'alist'},r.newAch.map(id=>{ const a=ACH.find(x=>x.id===id); return a&&h('div',{key:id,className:'arow new'},Ic(CAT_IC[a.cat]),h('div',null,h('div',{className:'an'},a.name),h('div',{className:'ad'},a.desc)),h('span',{className:'ap ok'},'達成')); })),
      h('div',{className:'rbtns'},
        h('button',{className:'cbtn yellow',onClick:()=>onRetry(r.mode)},h('span',{className:'main'},r.duel&&!r.duel.win?'リベンジ':'もう一度')),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}},
          h('button',{className:'cbtn blue sm',onClick:share},h('span',{className:'main'},r.duel?'挑戦状を送り返す':'挑戦状を送る')),
          h('button',{className:'cbtn green sm',onClick:()=>openSheet('gacha')},h('span',{className:'main'},'ガチャを引く'))),
        h('button',{className:'textbtn',onClick:()=>openSheet('rank',period)},'ランキングを見る'),
        msg&&h('p',{className:'toastline'},msg),
        h('button',{className:'textbtn',onClick:onHome},'ホームにもどる')))));
}

function Hud({hud,sound,toggleSound}){
  const fv=hud.fever>0, tp=Math.min(100,hud.time/GAME_TIME*100);
  const [pop,setPop]=useState(false), prev=useRef(0);
  useEffect(()=>{ if(hud.combo>prev.current){ setPop(true); const t=setTimeout(()=>setPop(false),260); prev.current=hud.combo; return ()=>clearTimeout(t); } prev.current=hud.combo; },[hud.combo]);
  return h(React.Fragment,null,
    h('div',{className:'hud'},
      h('div',{className:'hudrow'},
        h('div',{className:'hscore'},h('small',{className:'outl'},'スコア'),h('b',{className:'outl'},fmt(hud.score))),
        hud.tut?h('div',{className:'timer tutt',style:{'--p':100}},h('b',{className:'outl'},'練習')):h('div',{className:'timer'+(hud.time<=10?' warn':''),style:{'--p':tp}},h('b',{className:'outl'},Math.ceil(hud.time))),
        h('div',{className:'hright'},h('button',{className:'ibtn',onPointerDown:e=>e.stopPropagation(),onClick:toggleSound,'aria-label':sound?'音を消す':'音を出す'},Ic(sound?'sound':'mute')))),
      h('div',{className:'hudrow2'},
        h('div',{className:'fever'+(fv?' on':'')},Ic('fire'),h('i',{style:{width:`calc((100% - 30px) * ${fv?hud.fever/hud.feverMax:hud.gauge})`}}),h('span',{className:'outl'},fv?(hud.feverKind==='super'?'超フィーバー！ 得点3倍':'フィーバー！ 得点2倍'):'フィーバー')),
        h('div',{className:'boxchip'},Ic('box'),h('span',{className:'outl'},hud.boxes,'箱'),h('small',{className:'outl'},` ${hud.inBox}/${BOX_SIZE}`)))),
    hud.combo>=2&&h('div',{className:'combo'+(pop?' pop':'')},h('b',{className:'outl',style:{color:hud.combo>=10?'#FFD23C':'#fff'}},hud.combo),h('small',{className:'outl'},'コンボ')));
}

function TutOverlay({t,onSkip}){
  return h(React.Fragment,null,
    h('div',{className:'tutcard'},
      h('div',{className:'tsteps'},[0,1,2].map(i=>h('i',{key:i,className:i<t.ok?'ok':(i===t.ok?'cur':'')})),h('span',null,`練習 ${Math.min(3,t.ok+1)} / 3`)),
      t.fb?h('b',{className:'tfb'},t.fb):(t.msg?h('b',null,t.msg):null)),
    t.now&&h('div',{className:'tutnow'},h('b',{className:'outl'},'今！')),
    h('button',{className:'tutskip',onPointerDown:e=>e.stopPropagation(),onClick:onSkip},'練習をとばす'));
}
function TutEnd({onGo}){
  return h('div',{className:'result'},h('div',{className:'rcard tutend'},
    h('div',{className:'rtitle'},h('span',{className:'ribbon'},Ic('crown'),'練習かんりょう！')),
    h('div',{className:'sheetbody',style:{paddingTop:14}},
      h('div',{className:'howto'},
        h('div',null,h('b',null,'1'),h('span',null,'本番は60秒。金の矢印にぴったりでパーフェクト、少しずれてもグッド。')),
        h('div',null,h('b',null,'2'),h('span',null,'パーフェクトを続けるとフィーバー。得点が2倍になります。')),
        h('div',null,h('b',null,'3'),h('span',null,'とちゅうでボスが登場。スティックを当てて体力を0にしよう。')),
        h('div',null,h('b',null,'4'),h('span',null,'金色のスティックは3倍、細いスティックは2倍。むずかしいけど大きい。'))),
      h('button',{className:'cbtn yellow',onClick:onGo},h('span',{className:'main'},'本番スタート')))));
}
function App(){
  const canvasRef=useRef(null), eng=useRef(null), hudRef=useRef(null);
  const [screen,setScreen]=useState('title');
  const [hud,setHud]=useState({score:0,time:GAME_TIME,combo:0,inBox:0,boxes:0,gauge:0,fever:0,feverMax:FEVER_TIME});
  const [result,setResult]=useState(null);
  const [store,setStore]=useState(loadStore());
  const [sound,setSoundS]=useState(true);
  const [sheet,setSheet]=useState(null);
  const [tut,setTut]=useState(false), [tutEnd,setTutEnd]=useState(false), afterRef=useRef('normal');
  const screenRef=useRef(screen); screenRef.current=screen;
  useEffect(()=>{
    const e=new Engine(canvasRef.current,{hud:setHud,end:(r)=>{ setResult(r); setStore(loadStore()); setScreen('result'); },tutDone:()=>{ const s=loadStore(); s.tutDone=true; saveStore(s); setStore(s); setTutEnd(true); }});
    // 挑戦状のリンクから開いたとき
    const dv=parseDuelHash(location.hash); if(dv){ const s=loadStore(); if(!s.duel||s.duel.seed!==dv.seed||s.duel.score!==dv.score){ s.duel={...dv,my:null,tries:0}; saveStore(s); setStore(s); }
      try{ history.replaceState(null,'',location.pathname+location.search); }catch(err){} }
    eng.current=e; e.setFlavor(store.flavor); e.setSkin(store.skin);
    const ro=new ResizeObserver(()=>e.resize()); ro.observe(canvasRef.current.parentElement);
    const kd=ev=>{ if((ev.code==='Space'||ev.code==='Enter')&&screenRef.current==='play'){ ev.preventDefault(); e.press(); } };
    const ku=ev=>{ if(ev.code==='Space'||ev.code==='Enter') e.release(); };
    const blur=()=>e.release();
    window.addEventListener('keydown',kd); window.addEventListener('keyup',ku); window.addEventListener('blur',blur);
    if(document.fonts&&document.fonts.load) document.fonts.load(`900 20px "M PLUS Rounded 1c"`).catch(()=>{});
    return ()=>{ e.destroy(); ro.disconnect(); window.removeEventListener('keydown',kd); window.removeEventListener('keyup',ku); window.removeEventListener('blur',blur); };
  },[]);
  useEffect(()=>{ eng.current && eng.current.setFlavor(store.flavor); },[store.flavor]);
  // 上の帯の高さに合わせてゲームの配置を決める
  useEffect(()=>{ if(!eng.current) return; const el=hudRef.current;
    const hel=el&&el.querySelector('.hud'); const top=hel?hel.getBoundingClientRect().bottom+6:120; eng.current.setTop(screen==='play'?top:Math.max(140,window.innerHeight*0.2)); },[screen,hud.combo===0]);
  const start=(mode)=>{ Snd.unlock(); setSheet(null); setTutEnd(false); const s=loadStore(); setStore(s);
    if(mode==='duel'&&!s.duel) mode='normal';
    if(mode!=='tutorial'&&!s.tutDone&&(s.stats.games||0)===0){ afterRef.current=mode; mode='tutorial'; }
    else if(mode==='tutorial') afterRef.current='normal';
    eng.current.setFlavor(s.flavor); eng.current.setSkin(s.skin); setScreen('play'); eng.current.start(s,mode);
    if(mode!=='tutorial'&&!s.tutDone&&(s.stats.games||0)<3){ setTut(true); setTimeout(()=>setTut(false),3200); } };
  const skipTut=()=>{ const s=loadStore(); s.tutDone=true; saveStore(s); setStore(s); if(eng.current){ eng.current.running=false; eng.current.holding=false; Snd.bgmStop(); } start(afterRef.current); };
  const down=ev=>{ if(screen!=='play') return; ev.preventDefault(); Snd.unlock(); setTut(false); try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(e){} eng.current.press(); };
  const up=()=>{ eng.current && eng.current.release(); };
  const setSound=v=>{ Snd.unlock(); Snd.setOn(v); setSoundS(v); };
  const openSheet=(k,tab)=>{ setStore(loadStore()); setSheet({k,tab}); };
  const sheetEl = sheet && (
    sheet.k==='rank'? h(Sheet,{title:'ランキング',icon:'rank',onClose:()=>setSheet(null)},h(RankBody,{store,initTab:sheet.tab})) :
    sheet.k==='ach'? h(Sheet,{title:sheet.tab==='boss'?'ボス図鑑':'実績',icon:sheet.tab==='boss'?'crown':'medal',onClose:()=>setSheet(null)},h(AchBody,{store,bossOnly:sheet.tab==='boss'})) :
    sheet.k==='flavor'||sheet.k==='dress'? h(Sheet,{title:'着せ替え',icon:'shirt',onClose:()=>setSheet(null)},h(DressBody,{store,setStore:(n)=>{ setStore(n); eng.current&&(eng.current.setFlavor(n.flavor),eng.current.setSkin(n.skin)); },initTab:sheet.k==='flavor'?'flavor':'skin'})) :
    sheet.k==='gacha'? h(Sheet,{title:'着せ替えガチャ',icon:'gacha',onClose:()=>setSheet(null)},h(GachaBody,{store,setStore})) :
    sheet.k==='mission'? h(Sheet,{title:'今日のミッション',icon:'medal',onClose:()=>setSheet(null)},h(MissionBody,{store,setStore})) :
    sheet.k==='wheel'? h(Sheet,{title:'今日のルーレット',icon:'rank',onClose:()=>setSheet(null)},h(DailyWheel,{store,setStore,onClose:()=>setSheet(null)})) :
    h(Sheet,{title:'せってい',icon:'gear',onClose:()=>setSheet(null)},h(SettingsBody,{store,setStore,sound,setSound,onTutorial:()=>start('tutorial')})));
  const fl=FLAVORS.find(f=>f.id===store.flavor)||FLAVORS[0];
  return h('div',{className:'game'+(screen==='play'&&hud.fever>0?(hud.feverKind==='super'?' feverOn superOn':' feverOn'):''),style:{'--coat':fl.coat}},
    h('div',{className:'rotate'},h('i',null,'📱'),'スマホを縦向きにして遊んでね'),
    h('div',{className:'stage',onPointerDown:down,onPointerUp:up,onPointerCancel:up,onLostPointerCapture:up,onContextMenu:e=>e.preventDefault()},h('canvas',{ref:canvasRef})),
    screen==='play'&&h('div',{ref:hudRef,style:{position:'absolute',left:0,right:0,top:0,pointerEvents:'none'}},h(Hud,{hud,sound,toggleSound:()=>setSound(!sound)})),
    screen==='play'&&hud.tut&&!tutEnd&&h(TutOverlay,{t:hud.tut,onSkip:skipTut}),
    screen==='play'&&tutEnd&&h(TutEnd,{onGo:()=>start(afterRef.current)}),
    screen==='play'&&tut&&!hud.tut&&h('div',{className:'tut'},h('div',{className:'hand'}),h('b',{className:'outl'},'長押しでひたす・はなしてすくう')),
    screen==='title'&&h(Home,{store,setStore,onStart:start,openSheet}),
    screen==='result'&&result&&h(Result,{r:result,store,onRetry:start,onHome:()=>{ setStore(loadStore()); if(eng.current) eng.current.idle=true; setScreen('title'); },openSheet}),
    sheetEl);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
