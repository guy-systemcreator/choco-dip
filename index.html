<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>チョコディップ工房</title>
<meta name="description" content="長押しでひたして、はなしてすくう。チョコの泉でボスをたおし、全国ランキング1位を目指すスマホゲーム。">
<meta property="og:title" content="チョコディップ工房">
<meta property="og:description" content="長押しでひたして、はなしてすくう。ボスをたおして全国ランキング1位を目指せ。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#3A1A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="チョコディップ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
html{box-sizing:border-box;height:100%;padding-top:0}
body{margin:0;font-size:14px}
img{max-width:100%}[hidden]{display:none!important}
/* 画面構成：ゲーム画面は全面。上に数字の帯、下にタブ。パネルはクリーム色の紙で読みやすく */
:root{
  --choco:#3A1A0C; --choco-2:#5A2A14; --ink:#3A1A0C; --cream:#FFF6E6; --cream-2:#F7E6C8; --paper-line:#E8CFA4;
  --gold:#FFC93C; --gold-deep:#E08A12; --red:#E8323C; --red-deep:#A8121C; --leaf:#2E6A2A; --sky:#2F9BFF;
  --f-ui:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#0E1A10;color:#fff;font-family:var(--f-ui);font-weight:800;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
*{box-sizing:border-box}
#root{height:100%}
button,input{font-family:var(--f-ui)}
button{cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.game{position:fixed;inset:0;overflow:hidden;max-width:560px;margin:0 auto;background:#0E1A10}
.stage{position:absolute;inset:0;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 縁取り文字（ゲームの見出し・数字） */
.outl{color:#fff;text-shadow:0 3px 0 rgba(58,26,12,.9),2px 0 0 var(--choco),-2px 0 0 var(--choco),0 2px 0 var(--choco),0 -2px 0 var(--choco),2px 2px 0 var(--choco),-2px 2px 0 var(--choco),2px -2px 0 var(--choco),-2px -2px 0 var(--choco)}

/* 飴玉のような立体ボタン */
.cbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:22px;padding:14px 18px 16px;
  font-size:26px;font-weight:900;letter-spacing:.04em;color:#fff;
  background:linear-gradient(180deg,var(--b1) 0%,var(--b2) 55%,var(--b3) 100%);
  box-shadow:0 6px 0 var(--b4),0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.12);
  transition:transform .08s,box-shadow .08s}
.cbtn::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:42%;border-radius:16px 16px 40px 40px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.cbtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--b4),0 4px 8px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.45)}
.cbtn > *{position:relative}
.cbtn .main{text-shadow:0 3px 0 var(--b5,var(--b4)),2px 0 0 var(--b5,var(--b4)),-2px 0 0 var(--b5,var(--b4)),0 -2px 0 var(--b5,var(--b4)),0 2px 0 var(--b5,var(--b4)),2px 2px 0 var(--b5,var(--b4)),-2px 2px 0 var(--b5,var(--b4)),2px -2px 0 var(--b5,var(--b4)),-2px -2px 0 var(--b5,var(--b4))}
.cbtn small{font-size:12.5px;font-weight:800;letter-spacing:.02em;opacity:.95;text-shadow:0 1px 0 var(--b4)}
.cbtn.yellow{--b1:#FFE66B;--b2:#FFC21E;--b3:#FF9A0E;--b4:#B4580A;--b5:#8A3A04}
.cbtn.red{--b1:#FF8A7A;--b2:#F0404A;--b3:#C81E2C;--b4:#7E0A16}
.cbtn.blue{--b1:#7FD3FF;--b2:#2F9BFF;--b3:#1C6FDA;--b4:#0C3F8E}
.cbtn.green{--b1:#B8F06A;--b2:#5CCB2E;--b3:#2E9A1C;--b4:#1A5E10}
.cbtn.sm{font-size:16px;padding:10px 14px 12px;border-radius:16px;box-shadow:0 4px 0 var(--b4),0 6px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.55)}
.cbtn.sm::before{top:3px;border-radius:12px 12px 30px 30px}
.cbtn.sm:active{transform:translateY(3px)}
.badge-new{position:absolute;top:-8px;right:-6px;background:var(--red);color:#fff;font-size:11px;font-weight:900;border-radius:99px;padding:3px 8px;box-shadow:0 2px 0 var(--red-deep),0 0 0 2px #fff}

/* 丸いアイコンボタン */
.ibtn{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(180deg,#7A4A2A,#4A2412);box-shadow:0 4px 0 #2A1006,0 6px 10px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,180,.35)}
.ibtn img{width:32px;height:32px}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 #2A1006,inset 0 2px 0 rgba(255,220,180,.3)}

/* ホーム */
.home{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,rgba(8,20,10,.55) 0%,rgba(8,20,10,0) 22%,rgba(8,20,10,0) 55%,rgba(20,8,4,.55) 100%)}
.topbar{display:flex;align-items:center;gap:8px}
.lvchip{display:flex;align-items:center;gap:0;flex:1;min-width:0}
.lvbadge{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#FFF2A8,#FFC21E 45%,#D8820E 100%);box-shadow:0 3px 0 #8A4A06,0 0 0 3px #fff,0 5px 10px rgba(0,0,0,.35)}
.lvbadge b{font-size:21px;font-weight:900;color:#fff;text-shadow:0 2px 0 #8A4A06,1px 0 0 #8A4A06,-1px 0 0 #8A4A06,0 -1px 0 #8A4A06}
.lvbadge small{position:absolute;top:-6px;font-size:9px;font-weight:900;color:#8A4A06;background:#fff;border-radius:99px;padding:1px 5px}
.xpwrap{flex:1;min-width:0;margin-left:-14px;height:30px;border-radius:0 99px 99px 0;background:rgba(30,12,6,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.18);
  display:flex;align-items:center;padding:0 10px 0 20px;position:relative;overflow:hidden}
.xpwrap i{position:absolute;left:14px;top:5px;bottom:5px;border-radius:99px;background:linear-gradient(180deg,#B8F06A,#4CB82A);box-shadow:inset 0 2px 0 rgba(255,255,255,.5);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.xpwrap span{position:relative;font-size:12px;font-weight:900;margin-left:auto}
.chip{display:flex;align-items:center;gap:4px;height:34px;padding:0 10px 0 6px;border-radius:99px;background:rgba(30,12,6,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.18);font-size:15px;font-weight:900;white-space:nowrap}
.chip img{width:26px;height:26px}
.logo{display:block;width:min(86%,400px);margin:16px auto 0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
.tagline{text-align:center;font-size:14px;font-weight:900;margin-top:4px;letter-spacing:.06em}
.homespace{flex:1}
.actions{display:flex;flex-direction:column;gap:14px;padding:0 6px 14px}
.actions .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bestline{text-align:center;font-size:13px;font-weight:900;opacity:.95}
.bestline b{color:var(--gold);font-size:16px}

/* 下のタブ */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 -14px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:linear-gradient(180deg,#6A3A1E,#3E1C0C);box-shadow:0 -3px 0 rgba(255,210,160,.25),0 -10px 24px rgba(0,0,0,.35);border-radius:22px 22px 0 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 2px;border-radius:14px;font-size:11.5px;font-weight:900;color:#F7E6C8}
.tab img{width:38px;height:38px;transition:transform .15s}
.tab.on{background:linear-gradient(180deg,rgba(255,201,60,.35),rgba(255,201,60,.08));color:#fff}
.tab.on img{transform:translateY(-4px) scale(1.12)}
.tab:active img{transform:scale(.92)}

/* パネル（紙） */
.sheetbg{position:absolute;inset:0;z-index:20;background:rgba(10,4,2,.55);display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:relative;width:100%;max-height:88%;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);border-radius:26px 26px 0 0;
  box-shadow:0 -6px 0 var(--paper-line),0 -16px 40px rgba(0,0,0,.4);animation:up .28s cubic-bezier(.2,.9,.25,1.1);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(60%)}}
.sheet.center{margin:auto 14px;border-radius:26px;max-height:92%;box-shadow:0 8px 0 var(--paper-line),0 20px 50px rgba(0,0,0,.5)}
.sheethead{position:relative;display:flex;align-items:center;justify-content:center;padding:14px 56px 10px}
.ribbon{position:relative;display:inline-flex;align-items:center;gap:8px;padding:8px 26px 10px;font-size:20px;font-weight:900;color:#fff;
  background:linear-gradient(180deg,#FF6A5A,#D8202A);border-radius:12px;box-shadow:0 4px 0 #7E0A16,inset 0 2px 0 rgba(255,255,255,.45);
  text-shadow:0 2px 0 #7E0A16}
.ribbon img{width:30px;height:30px;margin:-6px 0}
.close{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,#FF8A7A,#D8202A);box-shadow:0 3px 0 #7E0A16,inset 0 2px 0 rgba(255,255,255,.5);
  color:#fff;font-size:22px;font-weight:900;display:grid;place-items:center;text-shadow:0 2px 0 #7E0A16}
.sheetbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--cream-2);box-shadow:inset 0 2px 3px rgba(90,42,20,.18)}
.seg button{padding:9px 2px;border-radius:10px;font-size:13px;font-weight:900;color:#8A5A3A}
.seg button.on{background:linear-gradient(180deg,#FFE66B,#FFB21E);color:#5A2A08;box-shadow:0 2px 0 #B4580A}
.note{font-size:13px;font-weight:700;line-height:1.6;color:#7A4A2A;margin:0}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rlist li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--paper-line)}
.rlist li.me{background:linear-gradient(180deg,#FFF4C2,#FFE07A);box-shadow:0 3px 0 #E0A82A}
.pos{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;font-weight:900;color:#fff;background:#C9A57A;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.rlist li:nth-child(1) .pos{background:radial-gradient(circle at 35% 30%,#FFF2A8,#FFC21E 50%,#D8820E);box-shadow:0 2px 0 #8A4A06}
.rlist li:nth-child(2) .pos{background:radial-gradient(circle at 35% 30%,#fff,#C8D2DA 50%,#8A98A4);box-shadow:0 2px 0 #5A6874}
.rlist li:nth-child(3) .pos{background:radial-gradient(circle at 35% 30%,#FFD8B0,#E0904A 50%,#A85A22);box-shadow:0 2px 0 #6A3410}
.nm{min-width:0;font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font-size:11.5px;font-weight:700;color:#9A6A4A}
.sc{font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--choco-2)}
.empty{font-size:14px;font-weight:800;color:#9A6A4A;text-align:center;padding:18px 0}
.mypos{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:900;padding:10px;border-radius:14px;background:var(--cream-2)}
.mypos b{font-size:22px;color:var(--red-deep)}

.achtop{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--paper-line)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--gold-deep) calc(var(--p)*1%),var(--cream-2) 0)}
.ring b{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;font-weight:900;color:var(--choco-2)}
.achtop .t{font-size:17px;font-weight:900}
.achtop .s{font-size:12.5px;font-weight:700;color:#9A6A4A}
.cat{font-size:14px;font-weight:900;color:var(--red-deep);margin:6px 2px 0;display:flex;align-items:center;gap:6px}
.cat::after{content:"";flex:1;height:2px;background:var(--paper-line);border-radius:2px}
.alist{display:flex;flex-direction:column;gap:7px}
.arow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--paper-line)}
.arow img{width:40px;height:40px}
.arow.lock img{filter:grayscale(1) opacity(.45)}
.arow .an{font-size:14.5px;font-weight:900;min-width:0}
.arow .ad{font-size:12px;font-weight:700;color:#9A6A4A;margin-top:1px}
.arow .ap{font-size:12px;font-weight:900;color:#9A6A4A;font-variant-numeric:tabular-nums;white-space:nowrap}
.arow .ap.ok{color:#2E9A1C}
.pbar{height:8px;border-radius:99px;background:var(--cream-2);overflow:hidden;margin-top:5px;box-shadow:inset 0 1px 2px rgba(90,42,20,.2)}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,#FFE66B,#FF9A0E)}
.arow.new{background:linear-gradient(180deg,#FFF8D6,#FFEFAE)}
.bossgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bosscard{border-radius:18px;background:linear-gradient(180deg,#5A2A14,#2A1006);padding:10px;text-align:center;color:#fff;box-shadow:0 3px 0 #1A0804}
.bosscard img{width:86px;height:106px;object-fit:contain;display:block;margin:0 auto 4px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.bosscard.lock img{filter:brightness(0) opacity(.6)}
.bosscard b{display:block;font-size:14px}
.bosscard span{font-size:11px;font-weight:700;opacity:.85;line-height:1.4;display:block}

.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fcard{position:relative;border-radius:18px;background:#fff;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 3px 0 var(--paper-line);color:var(--ink)}
.fcard.on{background:linear-gradient(180deg,#FFF4C2,#FFE07A);box-shadow:0 3px 0 #E0A82A,0 0 0 3px #FFB21E}
.fcard b{font-size:14px}
.fcard span{font-size:11px;font-weight:800;color:#9A6A4A}
.fcard.lock{opacity:.7}
.mini{position:relative;width:22px;height:110px;border-radius:11px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.25)}
.mini .bis{position:absolute;inset:0;background-size:100% 100%}
.mini .ct{position:absolute;left:0;right:0;bottom:0;height:62%;border-radius:0 0 11px 11px}
.mini .ct::after{content:"";position:absolute;left:22%;width:18%;top:8%;bottom:10%;border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0))}
.lockmark{position:absolute;top:8px;right:8px;font-size:11px;font-weight:900;color:#fff;background:#9A6A4A;border-radius:99px;padding:2px 7px}
.check{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:#2E9A1C;color:#fff;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 0 #1A5E10}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:900;color:#7A4A2A}
.field input{border:0;border-radius:14px;padding:13px 14px;font-size:17px;font-weight:800;background:#fff;color:var(--ink);box-shadow:inset 0 2px 3px rgba(90,42,20,.2),0 0 0 2px var(--paper-line)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--paper-line);font-size:15px;font-weight:900}
.sw{width:58px;height:32px;border-radius:99px;background:#D8C4A4;position:relative;box-shadow:inset 0 2px 3px rgba(0,0,0,.2);transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:#5CCB2E}
.sw.on::after{left:29px}
.howto{display:flex;flex-direction:column;gap:8px}
.howto div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--paper-line);font-size:13.5px;font-weight:800;line-height:1.5}
.howto b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#5A2A08;box-shadow:0 2px 0 #B4580A}

/* 遊ぶ画面の上の帯 */
.hud{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.hudrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hscore{display:flex;flex-direction:column;line-height:1}
.hscore small{font-size:11px;font-weight:900;color:#FFE9B0;letter-spacing:.1em}
.hscore b{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;margin-top:2px}
.timer{--p:100;position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--tc,#FFC93C) calc(var(--p)*1%),rgba(30,12,6,.6) 0);box-shadow:0 0 0 3px rgba(30,12,6,.75),0 4px 10px rgba(0,0,0,.35)}
.timer b{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#6A3A1E,#2A1006);font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.timer.warn{--tc:#FF4A4A;animation:beat .5s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.hright{display:flex;justify-content:flex-end}
.hright .ibtn{pointer-events:auto;width:42px;height:42px}
.hright .ibtn img{width:28px;height:28px}
.hudrow2{display:flex;align-items:center;gap:8px}
.fever{flex:1;display:flex;align-items:center;height:26px;border-radius:99px;background:rgba(30,12,6,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.15);position:relative;padding-left:30px;overflow:hidden}
.fever img{position:absolute;left:2px;top:1px;width:24px;height:24px;z-index:1}
.fever i{position:absolute;left:24px;top:5px;bottom:5px;border-radius:99px;background:linear-gradient(180deg,#FFE66B,#FF7A1A);box-shadow:inset 0 2px 0 rgba(255,255,255,.55);transition:width .15s}
.fever.on i{background:linear-gradient(90deg,#FF5A5A,#FFB21E,#FFF16B,#5CE05A,#3AB0FF,#B05AFF);background-size:200% 100%;animation:rb .6s linear infinite}
@keyframes rb{to{background-position:200% 0}}
.fever span{position:relative;margin-left:auto;margin-right:10px;font-size:11.5px;font-weight:900}
.boxchip{display:flex;align-items:center;gap:4px;height:26px;padding:0 10px 0 2px;border-radius:99px;background:rgba(30,12,6,.72);box-shadow:inset 0 2px 4px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.15);font-size:13px;font-weight:900;white-space:nowrap}
.boxchip img{width:26px;height:26px;margin-top:-4px}
.boxchip small{font-size:11px;opacity:.8}
.combo{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 112px);z-index:4;pointer-events:none;text-align:right;line-height:1}
.combo b{font-size:34px;font-weight:900;display:block}
.combo small{font-size:12px;font-weight:900;color:#FFE9B0}
.combo.pop b{animation:cpop .25s ease-out}
@keyframes cpop{from{transform:scale(1.4)}}
.tut{position:absolute;left:50%;bottom:24%;transform:translateX(-50%);z-index:5;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;animation:fade .3s}
.tut .hand{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0 30%,rgba(255,255,255,.35) 31% 55%,rgba(255,255,255,0) 56%);animation:press 1.2s ease-in-out infinite}
@keyframes press{0%,100%{transform:scale(1)}40%,70%{transform:scale(.75)}}
.tut b{font-size:18px}

/* 結果 */
.result{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px));background:rgba(10,4,2,.6);animation:fade .3s}
.rcard{position:relative;margin-top:26px;background:var(--cream);color:var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--paper-line),0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:100%;animation:up .35s cubic-bezier(.2,.9,.25,1.15)}
.rcard .sheetbody{padding-top:0}
.rtitle{display:flex;justify-content:center;margin-top:-22px}
.rank-badge{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;background:var(--choco);color:#FFE07A;font-size:16px;font-weight:900;box-shadow:0 3px 0 #1A0804}
.rank-badge img{width:24px;height:24px}
.bigscore{text-align:center;line-height:1}
.bigscore b{font-size:60px;font-weight:900;font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 4px 0 #B4580A,3px 0 0 #B4580A,-3px 0 0 #B4580A,0 -3px 0 #B4580A,3px 3px 0 #B4580A,-3px 3px 0 #B4580A,3px -3px 0 #B4580A,-3px -3px 0 #B4580A,0 8px 14px rgba(180,88,10,.4);
  background:none}
.bigscore small{display:block;font-size:13px;font-weight:900;color:#9A6A4A;margin-top:8px}
.newbest{display:inline-block;margin-left:6px;font-size:12px;font-weight:900;color:#fff;background:var(--red);border-radius:99px;padding:3px 9px;box-shadow:0 2px 0 var(--red-deep)}
.rankin{text-align:center;font-size:17px;font-weight:900;color:#5A2A08;padding:10px;border-radius:16px;background:linear-gradient(90deg,#FFB21E,#FFF16B,#FFB21E);background-size:200% 100%;animation:rb 1.4s linear infinite;box-shadow:0 3px 0 #B4580A}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats>div{background:#fff;border-radius:14px;padding:8px 4px;text-align:center;box-shadow:0 3px 0 var(--paper-line)}
.stats .k{font-size:11px;font-weight:900;color:#9A6A4A}
.stats .v{font-size:21px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--choco-2)}
.stats .v.p{color:#E08A12}
.xpbox{background:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--paper-line);display:flex;flex-direction:column;gap:6px}
.xptop{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:900}
.xptop b{font-size:18px;color:var(--choco-2)}
.xpbar{height:12px;border-radius:99px;background:var(--cream-2);overflow:hidden;box-shadow:inset 0 1px 3px rgba(90,42,20,.25)}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(180deg,#B8F06A,#4CB82A);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.bonus{font-size:12px;font-weight:900;color:#E08A12}
.lvup{text-align:center;font-size:20px;font-weight:900;color:#E08A12;animation:cpop .4s ease-out}
.lvup small{display:block;font-size:13px;color:#7A4A2A}
.nexts{display:flex;flex-direction:column;gap:6px;background:var(--cream-2);border-radius:16px;padding:10px 12px;font-size:13px;font-weight:800;color:#7A4A2A}
.nexts b{color:var(--red-deep)}
.rbtns{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.textbtn{font-size:14px;font-weight:900;color:#9A6A4A;padding:8px;text-decoration:underline;text-underline-offset:3px}
.toastline{font-size:12.5px;font-weight:800;color:#7A4A2A;text-align:center;word-break:break-all}

</style>
</head>

function emptyStats(){ const s={}; STAT_SUM.forEach(k=>s[k]=0); STAT_MAX.forEach(k=>s[k]=0); STAT_SET.forEach(k=>s[k]=[]); return s; }
function mergeStats(a,b){ const s={}; STAT_SUM.forEach(k=>s[k]=(a[k]||0)+(b[k]||0)); STAT_MAX.forEach(k=>s[k]=Math.max(a[k]||0,b[k]||0));
  STAT_SET.forEach(k=>s[k]=[...new Set([...(a[k]||[]),...(b[k]||[])])]); return s; }
function rid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }

let memStore=null;
function loadStore(){
  if(!memStore){
    memStore=defStore();
    try{
      const s=JSON.parse(localStorage.getItem('chocoDipStore3')||'null');
      if(s){ memStore=Object.assign(defStore(),s); memStore.stats=Object.assign(emptyStats(),s.stats||{}); }

    }catch(e){}

  return JSON.parse(JSON.stringify(memStore));
}

function weekKey(d0=new Date()){ const d=new Date(Date.UTC(d0.getFullYear(),d0.getMonth(),d0.getDate())); const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const y=d.getUTCFullYear(), w=Math.ceil(((d-Date.UTC(y,0,1))/86400000+1)/7); return y+String(w).padStart(2,'0'); }
function yesterdayKey(){ const d=new Date(); d.setDate(d.getDate()-1); return dayKey(d); }
function xpNeed(lv){ return Math.round(500*Math.pow(1.15,lv-1)); }

const Online = {
  enabled(){ return !!(RANK_CONFIG.projectId && RANK_CONFIG.apiKey); },
  base(){ return `https://firestore.googleapis.com/v1/projects/${RANK_CONFIG.projectId}/databases/(default)/documents`; },
  async req(url,opt){ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),8000);
    try{ const r=await fetch(url,{...opt,signal:ac.signal,headers:{'Content-Type':'application/json'}}); if(!r.ok) throw new Error('http '+r.status); return await r.json(); } finally{ clearTimeout(tm); } },
  async submit(coll,pid,d){
    const fields={ name:{stringValue:d.name.slice(0,12)}, score:{integerValue:String(d.score)}, lv:{integerValue:String(d.lv)}, combo:{integerValue:String(d.combo)}, ts:{integerValue:String(Date.now())} };
    return this.req(`${this.base()}/${coll}/${pid}?key=${RANK_CONFIG.apiKey}`,{method:'PATCH',body:JSON.stringify({fields})});
  },
  async top(coll,n=50){
    const res=await this.req(`${this.base()}:runQuery?key=${RANK_CONFIG.apiKey}`,{method:'POST',body:JSON.stringify({structuredQuery:{from:[{collectionId:coll}],orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:n}})});
    return (res||[]).filter(x=>x.document).map(x=>{ const f=x.document.fields||{}; return { id:x.document.name.split('/').pop(), name:f.name?f.name.stringValue:'？', score:+(f.score&&f.score.integerValue||0), lv:+(f.lv&&f.lv.integerValue||1), combo:+(f.combo&&f.combo.integerValue||0) }; });
  },
  async count(coll,above){
    const q={from:[{collectionId:coll}]};
    if(above!=null) q.where={fieldFilter:{field:{fieldPath:'score'},op:'GREATER_THAN',value:{integerValue:String(above)}}};
    const res=await this.req(`${this.base()}:runAggregationQuery?key=${RANK_CONFIG.apiKey}`,{method:'POST',body:JSON.stringify({structuredAggregationQuery:{structuredQuery:q,aggregations:[{alias:'c',count:{}}]}})});
    const r=res&&res[0]&&res[0].result; return r?+(r.aggregateFields.c.integerValue||0):0;
  },
};

/* ================= 絵の読みこみ ================= */
const IMG={};
for(const k in IMG_SRC){ const im=new Image(); im.decoding='async'; im.src=IMG_SRC[k]; IMG[k]=im; }
const imgOk=im=>im&&im.complete&&im.naturalWidth>0;
const FONT_UI='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif';

/* ================= 描画ヘルパー ================= */
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const ease=t=>1-Math.pow(1-t,3);
const mod5=x=>((Math.floor(x)%5)+5)%5;
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hexRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function tone(h,f,a=1){ const c=hexRgb(h).map(v=>Math.max(0,Math.min(255,Math.round(f>=1?v+(255-v)*(f-1):v*f)))); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

// ゲームの文字（太い縁取り＋グラデーション）
function gameText(ctx,text,x,y,size,style='gold',align='center'){
  ctx.save(); ctx.font=`900 ${size}px ${FONT_UI}`; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.lineJoin='round';
  const pal={gold:['#FFFBD0','#FFD23C','#FF8A12'],cream:['#FFFFFF','#FFF4D8','#FFD8A0'],red:['#FFE0D8','#FF7A6A','#D8202A'],blue:['#E8FBFF','#8FDCFF','#2F9BFF'],white:['#FFFFFF','#FFFFFF','#F0E0C8']}[style]||['#fff','#fff','#ddd'];
  ctx.shadowColor='rgba(40,10,4,.55)'; ctx.shadowOffsetY=size*0.09; ctx.shadowBlur=size*0.12;
  ctx.lineWidth=size*0.26; ctx.strokeStyle='#3A1406'; ctx.strokeText(text,x,y);
  ctx.shadowColor='transparent';
  ctx.lineWidth=size*0.1; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.strokeText(text,x,y);
  const g=ctx.createLinearGradient(0,y-size*0.5,0,y+size*0.5); g.addColorStop(0,pal[0]); g.addColorStop(0.5,pal[1]); g.addColorStop(1,pal[2]);
  ctx.fillStyle=g; ctx.fillText(text,x,y);
  ctx.restore();
}

// スティック：原点＝下の端の中央。ビスケットは絵、チョコはつやのある円柱として描く
function drawStick(ctx,L,w,coat,type,target,t,seed,fl,tAlpha=1){
  const r=w/2;
  ctx.save();
  rr(ctx,-r,-L,w,L,r); ctx.clip();
  if(imgOk(IMG.biscuit)) ctx.drawImage(IMG.biscuit,-r,-L,w,L); else { ctx.fillStyle='#E5B465'; ctx.fillRect(-r,-L,w,L); }
  if(type==='gold'){ const g=ctx.createLinearGradient(-r,0,r,0); g.addColorStop(0,'rgba(255,200,60,.35)'); g.addColorStop(.4,'rgba(255,240,170,.55)'); g.addColorStop(1,'rgba(200,130,20,.45)'); ctx.fillStyle=g; ctx.fillRect(-r,-L,w,L); }
  ctx.restore();
  if(coat>0.003){
    const cl=Math.max(r,coat*L), R=r+0.6, base=type==='gold'?'#3A1A0C':fl.coat;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-R,-cl);
    for(let i=0;i<=8;i++){ ctx.lineTo(-R+(2*R)*i/8,-cl+Math.sin(i*1.7+seed)*1.6); }
    ctx.lineTo(R,-r); ctx.arc(0,-r,R,0,Math.PI); ctx.closePath();
    const g=ctx.createLinearGradient(-R,0,R,0);
    g.addColorStop(0,tone(base,0.45)); g.addColorStop(0.2,tone(base,0.95)); g.addColorStop(0.36,tone(base,1.28)); g.addColorStop(0.55,tone(base,1.0)); g.addColorStop(0.85,tone(base,0.55)); g.addColorStop(1,tone(base,0.8));
    ctx.fillStyle=g; ctx.fill();
    // しずく
    const dy=-cl+5+(Math.sin(seed*3)*0.5+0.5)*7;
    ctx.beginPath(); ctx.ellipse(r*0.3,dy,Math.max(1.2,r*0.32),3.4,0,0,Math.PI*2); ctx.fill();
    // つや（白いすじ）
    const sg=ctx.createLinearGradient(0,-cl,0,-r); sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.2,'rgba(255,255,255,.75)'); sg.addColorStop(0.8,'rgba(255,255,255,.55)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg; rr(ctx,-r*0.52,-cl+3,Math.max(1.5,w*0.13),Math.max(2,cl-r-4),2); ctx.fill();
    ctx.globalAlpha=0.25; rr(ctx,r*0.35,-cl+5,Math.max(1,w*0.07),Math.max(2,cl-r-8),2); ctx.fill(); ctx.globalAlpha=1;
    if(type==='gold'||fl.flecks){ for(let i=0;i<Math.floor(cl/7);i++){ const xx=((i*37+seed*13)%10)/10*w-r, yy=-cl+5+i*7; ctx.fillStyle=i%2?'#FFE9A0':'#F3C24E'; ctx.fillRect(xx,yy,1.8,1.8); } }
    ctx.restore();
  }
  if(target!=null && tAlpha>0.02){
    const ty=-target*L, a=(0.7+0.3*Math.sin(t*6))*tAlpha;
    ctx.save(); ctx.globalAlpha=a;
    ctx.shadowColor='rgba(255,210,80,.9)'; ctx.shadowBlur=10;
    ctx.fillStyle='#FFD23C'; ctx.strokeStyle='#3A1406'; ctx.lineWidth=2; ctx.lineJoin='round';
    for(const s of [-1,1]){ ctx.beginPath(); ctx.moveTo(s*(r+15),ty-8); ctx.lineTo(s*(r+3),ty); ctx.lineTo(s*(r+15),ty+8); ctx.closePath(); ctx.stroke(); ctx.fill(); }
    ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,220,100,.95)'; ctx.lineWidth=2; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(-r,ty); ctx.lineTo(r,ty); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
  }
}
function drawSymbol(ctx,i,size,fl){
  if(i<=2){ const im=IMG['pod'+i]; if(imgOk(im)){ const h=size*0.95, w=h*im.naturalWidth/im.naturalHeight; ctx.drawImage(im,-w/2,-h/2,w,h); } }
  else if(i===3){ ctx.save(); ctx.rotate(0.5); ctx.translate(0,size*0.42); drawStick(ctx,size*0.84,size*0.16,0.6,'normal',null,0,1,fl); ctx.restore(); }
  else { const r=size*0.36; const g=ctx.createRadialGradient(-r*0.35,-r*0.35,1,0,0,r); g.addColorStop(0,'#FFF8C8'); g.addColorStop(0.5,'#FFC83A'); g.addColorStop(1,'#B8700E');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill(); ctx.lineWidth=2.5; ctx.strokeStyle='#7A4206'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*0.74,0,Math.PI*2); ctx.strokeStyle='rgba(122,66,6,.5)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='#7A2A06'; ctx.font=`900 ${Math.round(r*1.05)}px ${FONT_UI}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('金',0,2); }
}

/* ================= ゲーム本体 ================= */
class Engine{
  constructor(canvas,hooks){
    this.c=canvas; this.ctx=canvas.getContext('2d'); this.hooks=hooks;
    this.t=0; this.running=false; this.holding=false; this.startDelay=0; this.top=120;
    this.particles=[]; this.popups=[]; this.flyers=[]; this.banners=[]; this.toasts=[]; this.ripples=[];
    this.level=0; this.lastHud=0; this.lastTick=99; this.fever=0; this.gauge=0; this.slot=null; this.boss=null;
    this.shake=0; this.flash=0; this.flashCol='255,255,255'; this.score=0; this.disp=0; this.combo=0;
    this.fl=FLAVORS[0]; this.srand=Math.random; this.ampNow=0; this.idle=true;
    this.resize();
    this.motes=Array.from({length:22},()=>({x:Math.random(),y:Math.random()*0.75,s:0.5+Math.random(),v:0.004+Math.random()*0.01,p:Math.random()*6}));
    this.glints=Array.from({length:6},(_,i)=>({x:Math.random(),v:(0.012+Math.random()*0.02)*(i%2?1:-1),d:0.02+Math.random()*0.5,w:0.12+Math.random()*0.22}));
    this.stick=this.newStick(); this.stick.phase='ready'; this.stick.pos=0; this.stick.enterT=1; this.stick.type='normal';
    this.last=performance.now(); this.frame=this.frame.bind(this); this.raf=requestAnimationFrame(this.frame);
  }
  destroy(){ cancelAnimationFrame(this.raf); Snd.bgmStop(); }
  setFlavor(id){ this.fl=FLAVORS.find(f=>f.id===id)||FLAVORS[0]; }
  setTop(px){ this.top=px; this.layout(); }
  resize(){
    const p=this.c.parentElement.getBoundingClientRect(), dpr=Math.min(2,window.devicePixelRatio||1);
    this.W=Math.max(240,p.width); this.H=Math.max(360,p.height); this.dpr=dpr;
    this.c.width=Math.round(this.W*dpr); this.c.height=Math.round(this.H*dpr);
    this.layout();
  }
  layout(){
    const W=this.W,H=this.H;
    const base=H*0.8, gap=H*0.04, L=Math.min(H*0.36,base-gap-this.top-H*0.16);
    this.g={W,H,L,base,gap,x:W*0.5,w:Math.max(14,Math.min(22,W*0.052))};
    this.g.restBottom=base-gap;
  }
  stickTop(){ return this.g.restBottom-this.g.L; }
  jy(){ return this.top+(this.stickTop()-this.top)*0.5+8; }
  bossPos(){ const b=this.boss, W=this.W, H=this.H, size=Math.min(W*0.34,H*0.25);
    let x=W*0.79, y=this.g.base-size*0.62+Math.sin(this.t*2.2)*7;
    if(b.state==='enter') y=-size+(y+size)*ease(b.enterT);
    if(b.state==='escape') x=W*0.79+W*0.6*ease(Math.min(1,b.downT));
    return {x:x+(Math.random()-0.5)*b.shk,y,size}; }
  newStick(){
    const lv=this.level, r=this.srand(), r2=this.srand(); let type='normal';
    if(lv>=1 && r<0.24) type='thin';
    if(lv>=1 && r>(this.fever>0?0.8:0.93)) type='gold';
    return {type,target:0.56+r2*0.3,coat:0,pos:-this.H,phase:'enter',enterT:0,prevSub:-1,sub:-1,seed:Math.random()*6,tAlpha:1};
  }
  bossType(){ return this.boss&&this.boss.state==='fight'?this.boss.def.type:null; }
  speed(s){ let v=this.g.L*(0.5+this.level*0.07); if(s.type==='thin') v*=1.45; if(s.type==='gold') v*=1.25;
    const bt=this.bossType(); if(bt==='fast') v*=1.55; if(bt==='king') v*=1.25; return v; }
  surfY(){ const lv=this.level, bt=this.bossType(); let amp=lv>=2?Math.min(this.H*0.03,(lv-1)*this.H*0.007):0, sp=1.7;
    if(bt==='wave'){ amp=this.H*0.055; sp=2.3; } if(bt==='king'){ amp=Math.max(amp,this.H*0.035); sp=2; }
    this.ampNow=(this.ampNow||0)+(amp-(this.ampNow||0))*0.05;
    return this.g.base+Math.sin(this.t*sp)*this.ampNow+Math.sin(this.t*3.3)*1.2; }

  start(store,mode){
    this.running=true; this.holding=false; this.store=store; this.mode=mode; this.idle=false;
    this.srand = mode==='daily' ? mulberry(+dayKey()*7+13) : Math.random;
    this.score=0; this.disp=0; this.combo=0; this.chain=0; this.time=GAME_TIME; this.elapsed=0; this.inBox=0; this.done=0; this.level=0;
    this.run=emptyStats(); this.judges=[]; this.unlocked=new Set();
    this.particles=[]; this.popups=[]; this.flyers=[]; this.banners=[]; this.toasts=[]; this.ripples=[]; this.lastTick=99; this.fever=0; this.gauge=0; this.slot=null; this.pendingSlot=null;
    this.boss=null; this.bossIdx=0; this.nextBossAt=15;
    this.startDelay=1.6; this.goShown=false; this.slotTickT=0;
    this.stick=this.newStick();
    this.popup('よーい…',this.W/2,this.jy(),'#FFF3DE',34,1.2);
    Snd.start(); this.pushHud(true);
  }
  press(){ this.holding=true; } release(){ this.holding=false; }
  popup(text,x,y,color,size,life=1){ const st=/^#FFB4|^#FFB/.test(color)?'red':(/^#FFF3DE|^#FFFFFF|^#FFF$/.test(color)?'cream':(/^rgba/.test(color)?'white':'gold')); this.popups.push({text,x,y,style:st,size,life,max:life}); }
  toast(text,color='#F4DFA4'){ this.toasts.push({text,color,life:2.4,max:2.4}); }
  banner(text,sub,big){ this.banners.push({text,sub,big,life:big?1.8:1.3,max:big?1.8:1.3}); }
  splash(x,y,n=12,col){ for(let i=0;i<n;i++) this.particles.push({x:x+(Math.random()-0.5)*8,y,vx:(Math.random()-0.5)*130,vy:-70-Math.random()*170,life:0.7+Math.random()*0.4,r:2.5+Math.random()*3.5,col:col||this.fl.drop,grav:560}); }
  sparkle(x,y,n=18){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,v=60+Math.random()*200; this.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.6+Math.random()*0.5,r:1.5+Math.random()*2.8,col:Math.random()<0.5?'#F4DFA4':'#FFD166',grav:80,star:true}); } }
  coinBurst(n=26){ for(let i=0;i<n;i++) this.particles.push({x:this.W*Math.random(),y:-10-Math.random()*40,vx:(Math.random()-0.5)*60,vy:80+Math.random()*160,life:1.6,r:4+Math.random()*3,col:'#FFD166',grav:240,coin:true,spin:Math.random()*6}); }

  liveStats(){ const r=this.run; r.bestScore=this.score; r.maxFeverRun=r.fevers; r.maxBossRun=r.bossKills; return mergeStats(this.store.stats,r); }
  checkAch(){
    const S=this.liveStats(), lv=levelInfo(this.store.xp).lv;
    for(const a of ACH){ if(this.store.ach.includes(a.id)||this.unlocked.has(a.id)) continue;
      if(a.val(S,lv)>=a.goal){ this.unlocked.add(a.id); this.toast('実績解除：'+a.name); Snd.achieve(); } }
  }

  startFever(){
    if(this.fever>0||!this.running) return;
    this.fever=FEVER_TIME; this.gauge=0; this.run.fevers++;
    this.banner('フィーバー突入！','得点2倍・金のスティック出現アップ',true);
    this.shake=12; this.flash=0.9; this.flashCol='255,230,150'; this.coinBurst(30); haptic([30,40,30]);
    Snd.feverStart(); Snd.bgm.fever=true;
    this.checkAch(); this.pushHud(true);
  }
  startSlot(pWin,label){
    if(!this.running) return;
    if(this.slot||this.fever>0||this.boss){ this.pendingSlot={pWin,label}; return; }
    const win=Math.random()<pWin; let r;
    if(win){ const s=Math.random()<0.4?4:(Math.random()*4|0); r=[s,s,s]; }
    else if(Math.random()<0.45){ const s=Math.random()*5|0; r=[s,s,(s+(Math.random()<0.5?1:4))%5]; }
    else { const a=Math.random()*5|0, b=(a+1+(Math.random()*4|0))%5; r=[a,b,Math.random()*5|0]; }
    const reach=r[0]===r[1];
    this.slot={r,win,reach,t:0,stops:[0.75,1.15,reach?3.1:1.55],stopped:[false,false,false],off:[Math.random()*5,Math.random()*5,Math.random()*5],done:false,doneT:0};
    if(label) this.toast(label,'#FFD166');
    Snd.shakin();
  }
  updSlot(dt){
    const S=this.slot; if(!S) return;
    S.t+=dt; let spinning=false;
    for(let i=0;i<3;i++){
      if(S.stopped[i]) continue;
      const stop=S.stops[i], land=(S.reach&&i===2)?0.7:0.28, rem=stop-S.t;
      if(rem<=0){ S.stopped[i]=true; S.off[i]=S.r[i]; Snd.slotStop(i); haptic(15);
        if(i===1 && S.reach){ this.banner('リーチ！',S.r[0]===4?'金リーチ… 激アツ':'そろえば大当たり',false); this.flash=0.35; this.flashCol='255,120,90'; Snd.reach(S.stops[2]-S.stops[1]); }
        continue; }
      spinning=true;
      if(rem<land){ const k=rem/land; S.off[i]=S.r[i]-k*k*(S.reach&&i===2?3:1.5); }
      else { const sp=(S.reach&&i===2&&S.t>S.stops[1])?Math.max(5,16-(S.t-S.stops[1])*7):16; S.off[i]+=sp*dt; }
    }
    if(spinning){ this.slotTickT-=dt; if(this.slotTickT<=0){ this.slotTickT=0.075; Snd.slotTick(); } }
    if(!spinning && !S.done){
      S.done=true;
      if(S.win){ this.run.jackpots++; this.banner('大当たり！','',true); Snd.jackpot(); this.coinBurst(40); haptic([40,40,40,40,80]); this.score+=500; this.popup('+500',this.W/2,this.jy()+40,'#FFD166',28,1.2); setTimeout(()=>this.startFever(),900); }
      else if(S.reach){ this.run.reachMiss++; this.popup('おしい…！ あと1コマ',this.W/2,this.jy(),'#FFB4A0',22,1.3); Snd.nearMiss(); }
      else { this.popup('はずれ',this.W/2,this.jy(),'rgba(255,243,222,0.8)',18,0.8); }

    }

  }

  spawnBoss(){
    const def=BOSSES[this.bossIdx];
    this.boss={def,hp:def.hp,max:def.hp,t:0,dur:13,state:'enter',enterT:0,hitT:0,downT:0,shk:0};
    this.banner('ボス出現！',def.name+'：'+def.desc,true);
    this.flash=0.5; this.flashCol='255,60,60'; this.shake=10; haptic([60,60,60]);
    Snd.siren(); Snd.bgm.boss=true;
  }
  endBoss(defeated){
    const b=this.boss; if(!b) return;
    if(defeated){
      b.state='down'; b.downT=0;
      this.run.bossKills++; if(!this.run.bossTypes.includes(b.def.type)) this.run.bossTypes.push(b.def.type);
      this.score+=b.def.bonus; this.time+=4; this.gauge=Math.min(1,this.gauge+0.4);
      this.banner(b.def.name+' 撃破！',`+${b.def.bonus}点 ＋4秒`,true);
      this.coinBurst(46); this.shake=16; this.flash=1; this.flashCol='255,240,190'; haptic([80,50,80,50,160]);
      Snd.bossDown();
      if(this.gauge>=1) setTimeout(()=>this.startFever(),1200);
    } else {
      b.state='escape'; b.downT=0;
      this.popup(b.def.name+'に逃げられた…',this.W/2,this.jy(),'#FFB4A0',20,1.4); Snd.nearMiss();
    }
    this.bossIdx++; this.nextBossAt=this.elapsed+8;
    Snd.bgm.boss=false; this.checkAch();
  }
  updBoss(dt){
    const b=this.boss;
    if(!b){
      if(this.running&&this.startDelay<=0&&this.bossIdx<BOSSES.length&&this.elapsed>=this.nextBossAt&&this.time>9&&!this.slot) this.spawnBoss();
      return;
    }
    b.t+=dt; b.hitT=Math.max(0,b.hitT-dt); b.shk=Math.max(0,b.shk-dt*30);
    if(b.state==='enter'){ b.enterT+=dt/0.7; if(b.enterT>=1){ b.enterT=1; b.state='fight'; b.t=0; } }
    else if(b.state==='fight'){ if(b.t>=b.dur||!this.running) this.endBoss(false); }
    else { b.downT+=dt; if(b.downT>1.2){ this.boss=null; if(this.pendingSlot){ const p=this.pendingSlot; this.pendingSlot=null; setTimeout(()=>this.startSlot(p.pWin,p.label),400); } } }
  }
  evaluate(){
    const s=this.stick, G=this.g;
    if(!this.running){ s.coat=0; s.phase='ready'; return; }
    const c=s.coat, tg=s.target, d=Math.abs(c-tg);
    let res,label;
    if(c>=0.985){ res='miss'; label='持ち手がない！'; }
    else if(d<=0.03){ res='perfect'; label='パーフェクト！'; }
    else if(d<=0.08){ res='good'; label='グッド'; }
    else { res='miss'; label=c<tg?'うすづけ…':'つけすぎ…'; }
    this.run[res]++; this.done++; this.judges.push(res);
    const mult=(s.type==='thin'?2:s.type==='gold'?3:1)*(this.fever>0?2:1);
    const JX=this.W/2, JY=this.jy(), w=s.type==='thin'?G.w*0.62:G.w;
    const fighting=this.boss&&this.boss.state==='fight';
    if(res==='miss'){
      if(this.combo>=5) this.popup(this.combo+'コンボ ストップ',JX,JY+62,'#FFB4A0',16,1);
      this.combo=0; this.chain=0; Snd.miss(); this.shake=5; haptic(40);
      this.popup(label,JX,JY,'#FFB4A0',30,1.1);
      if(c<tg && tg-c<0.12) this.popup(`あと${Math.max(1,Math.round((tg-c)*100))}%だった`,JX,JY+36,'#FFF3DE',16,1.1);
      if(fighting){ const b=this.boss; b.hp=Math.min(b.max,b.hp+2); this.time=Math.max(0.5,this.time-1); this.toast('ボスの反撃！ 回復＋時間−1秒','#FFB4A0'); Snd.bossHeal(); }
      this.flyers.push({kind:'sink',x:G.x,y:G.restBottom,vy:260,rot:0,L:G.L,w,coat:c,type:s.type,seed:s.seed,life:0.55});
    } else {
      this.combo++; this.run.maxCombo=Math.max(this.run.maxCombo,this.combo); this.run.sticks++;
      if(res==='perfect'){ this.chain++; this.run.perfectChainMax=Math.max(this.run.perfectChainMax,this.chain); if(s.type==='thin') this.run.thinPerfect++; if(s.type==='gold') this.run.goldPerfect++; } else this.chain=0;
      const base=res==='perfect'?100:40, pts=Math.round(base*mult*(1+Math.min(this.combo,30)*0.1));
      this.score+=pts;
      if(res==='perfect'){ Snd.perfect(this.combo); this.sparkle(G.x,G.restBottom-c*G.L,s.type==='gold'?40:20); this.shake=Math.max(this.shake,3+Math.min(6,this.combo*0.3)); this.flash=Math.max(this.flash,0.12); this.flashCol='255,240,200'; haptic(20); }
      else { Snd.good(this.combo); haptic(10); if(d<=0.045) this.popup('おしい！ パーフェクトまであと少し',JX,JY+70,'#FFF3DE',15,1); }
      this.popup(label,JX,JY,res==='perfect'?'#F4DFA4':'#FFF3DE',res==='perfect'?38:30,1.1);
      this.popup('+'+pts,JX,JY+38,mult>=2?'#FFD166':'#E3BD64',mult>=4?26:21,0.9);
      this.flyers.push({kind:'fly',x0:G.x,y0:G.restBottom,t:0,L:G.L,w,coat:c,type:s.type,seed:s.seed});
      if(fighting){
        const b=this.boss; let dmg=res==='perfect'?3:1; if(s.type==='thin') dmg+=1; if(s.type==='gold') dmg+=3; if(this.fever>0) dmg*=2;
        b.hp=Math.max(0,b.hp-dmg); b.hitT=0.25; b.shk=10; Snd.bossHit(dmg>=3);
        const bp=this.bossPos(); this.popup('−'+dmg,bp.x,bp.y-bp.size*0.6,'#FFFFFF',22+dmg*1.5,0.8); this.sparkle(bp.x,bp.y,10);
        if(b.hp<=0) this.endBoss(true);
      }
      if(this.fever<=0){ this.gauge=Math.min(1,this.gauge+(res==='perfect'?0.17:0.07)); if(this.gauge>=1) setTimeout(()=>this.startFever(),350); }
      if(this.combo%10===0){ const bn=this.combo*20; this.score+=bn; this.banner(this.combo+'コンボ！','ボーナス +'+bn,false); Snd.milestone(); this.flash=0.4; this.flashCol='255,214,120'; this.coinBurst(14); }
      this.inBox++;
      if(this.inBox>=BOX_SIZE){
        this.inBox=0; this.run.boxes++; this.score+=300; this.time+=5; Snd.box();
        this.toast('1箱完成！ +300点 ＋5秒');
        setTimeout(()=>this.startSlot(0.25,'出荷ボーナス！ スロット抽選'),500);
      } else if(res==='perfect' && Math.random()<0.08){

      }
    }
    this.level=Math.min(8,Math.floor(this.done/4));
    this.stick=this.newStick();
    if(this.stick.type==='gold'){ setTimeout(()=>{ if(this.running){ Snd.kyuin(); this.flash=0.3; this.flashCol='255,220,120'; this.toast('金のスティック！ 3倍','#FFD166'); } },150); }
    else if(this.stick.type==='thin') Snd.shakin();

  }

  finish(){
    this.running=false; this.holding=false; Snd.bgmStop(); Snd.finish(); this.slot=null;
    if(this.boss&&this.boss.state==='fight') this.endBoss(false);
    const prev=loadStore(), today=dayKey(), firstToday=prev.lastDay!==today;
    let streak=prev.streak||0; if(firstToday) streak = prev.lastDay===yesterdayKey()?streak+1:1;
    const r=this.run; r.games=1; r.bestScore=this.score; r.maxFeverRun=r.fevers; r.maxBossRun=r.bossKills;
    r.noMissGames=(r.miss===0&&this.done>=20)?1:0; r.dailyGames=this.mode==='daily'?1:0; r.flavorsPlayed=[this.fl.id]; r.streakMax=streak;
    const stats=mergeStats(prev.stats,r);
    const name=displayName(prev);
    const rank=prev.rank.slice(); const entry={name,score:this.score,date:(new Date().getMonth()+1)+'/'+new Date().getDate(),id:Date.now()};
    rank.push(entry); rank.sort((a,b)=>b.score-a.score); const top=rank.slice(0,10);
    const pos=top.findIndex(e=>e.id===entry.id);
    const daily1=this.mode==='daily'&&!(prev.bests['q'+today]>=0);
    const streakBonus=firstToday?Math.min(streak,7)*30:0;
    const xpGain=Math.round(this.score/35)*(daily1?2:1)+15+streakBonus;
    const xpAfter=prev.xp+xpGain, lvAfter=levelInfo(xpAfter).lv;
    const achAll=new Set([...prev.ach,...this.unlocked]);
    for(const a of ACH) if(!achAll.has(a.id) && a.val(stats,lvAfter)>=a.goal) achAll.add(a.id);
    const newAch=[...achAll].filter(id=>!prev.ach.includes(id));
    const isBest=this.score>prev.best;
    const next={...prev,best:Math.max(prev.best,this.score),ach:[...achAll],xp:xpAfter,lastDay:today,streak,stats,rank:top};
    saveStore(next);
    this.banner('しゅうりょう！','',true);
    const res={score:this.score,mode:this.mode,run:{...r},judges:this.judges.slice(),newAch,isBest,prevBest:prev.best,localPos:pos>=0?pos+1:null,entryId:entry.id,
      xpBefore:prev.xp,xpAfter,xpGain,streak,streakBonus,firstToday,daily1};
    setTimeout(()=>this.hooks.end(res),1300);
  }

  pushHud(force){
    if(!force && this.t-this.lastHud<0.05) return;
    this.lastHud=this.t;
    this.hooks.hud({score:Math.round(this.disp),time:Math.max(0,this.time||0),combo:this.combo||0,inBox:this.inBox||0,boxes:this.run?this.run.boxes:0,gauge:this.gauge,fever:this.fever,feverMax:FEVER_TIME});
  }

  update(dt){
    this.t+=dt; const G=this.g;
    if(this.running){
      if(this.startDelay>0){
        this.startDelay-=dt;
        if(this.startDelay<=0 && !this.goShown){ this.goShown=true; Snd.bgmStart(); this.popup('スタート！',this.W/2,this.jy(),'#F4DFA4',42,0.9); }
      } else {
        this.time-=dt; this.elapsed+=dt;
        const sec=Math.ceil(this.time);
        if(sec<=5 && sec>0 && sec!==this.lastTick){ this.lastTick=sec; Snd.note(1000,{type:'square',dur:0.05,vol:0.04,wet:0}); }
        if(this.time<=0){ this.time=0; this.pushHud(true); this.finish(); }
      }
      if(this.fever>0){ this.fever-=dt; if(Math.random()<dt*40) this.particles.push({x:Math.random()*this.W,y:-6,vx:(Math.random()-0.5)*30,vy:70+Math.random()*80,life:2,r:1.5+Math.random()*2.5,col:Math.random()<0.5?'#FFD166':'#FFF1A8',grav:20,star:true});
        if(this.fever<=0){ this.fever=0; Snd.bgm.fever=false; this.toast('フィーバー終了','#FFF3DE');
          if(this.pendingSlot&&!this.boss){ const p=this.pendingSlot; this.pendingSlot=null; setTimeout(()=>this.startSlot(p.pWin,p.label),400); } } }
    }
    this.disp+=(this.score-this.disp)*Math.min(1,dt*10); if(Math.abs(this.score-this.disp)<1) this.disp=this.score;
    if(this.running) this.pushHud(false);
    this.updSlot(dt); this.updBoss(dt);
    this.surf=this.surfY();
    const s=this.stick, bt=this.bossType();
    if(s){
      if(s.phase==='enter'){ s.enterT+=dt/0.4; if(s.enterT>=1){ s.enterT=1; s.phase='ready'; } s.pos=-this.H*0.75*Math.pow(1-s.enterT,3); }
      else {
        const can=this.running&&this.startDelay<=0;
        if(can&&this.holding) s.phase='down'; else if(s.phase==='down') s.phase='up';
        if(s.phase==='down'){ s.pos+=this.speed(s)*dt; const mx=G.gap+G.L; if(s.pos>mx) s.pos=mx; }
        if(s.phase==='up'){ s.pos-=G.L*1.35*dt; if(s.pos<=0){ s.pos=0; if(s.coat>0.005) this.evaluate(); else s.phase='ready'; } }
      }
      // きりがくれ・大王：ひたしている間は目じるしが消える
      let want=1; if((bt==='fog'||bt==='king') && (s.phase==='down'||s.phase==='up')) want = bt==='fog'?0:(Math.sin(this.t*9)>0.3?0.9:0.08);
      s.tAlpha += (want-s.tAlpha)*Math.min(1,dt*10);
      if(this.stick===s){
        const sub=(G.restBottom+s.pos-this.surf)/G.L;
        if(s.phase!=='enter'){ if(sub>0&&s.prevSub<=0&&this.running){ this.splash(G.x,this.surf); this.ripples.push({x:G.x,t:0}); Snd.plop(); } if(sub>s.coat&&this.running) s.coat=Math.min(1,sub); }
        s.prevSub=sub; s.sub=sub;
      }
    }
    for(const p of this.particles){ p.life-=dt; p.vy+=p.grav*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.spin!=null) p.spin+=dt*8; }
    this.particles=this.particles.filter(p=>p.life>0&&p.y<this.H+20);
    for(const p of this.popups){ p.life-=dt; p.y-=18*dt; } this.popups=this.popups.filter(p=>p.life>0);
    for(const b of this.banners) b.life-=dt; this.banners=this.banners.filter(b=>b.life>0);
    for(const b of this.toasts) b.life-=dt; this.toasts=this.toasts.filter(b=>b.life>0);
    for(const f of this.flyers){ if(f.kind==='fly') f.t+=dt/0.55; else { f.vy+=260*dt; f.y+=f.vy*dt; f.rot+=dt*0.6; f.life-=dt; } }
    this.flyers=this.flyers.filter(f=>f.kind==='fly'?f.t<1:f.life>0);
    for(const r of this.ripples) r.t+=dt/0.9; this.ripples=this.ripples.filter(r=>r.t<1);
    this.shake=Math.max(0,this.shake-dt*28); this.flash=Math.max(0,this.flash-dt*2.2);
  }


  frame(ts){ const dt=Math.min(0.05,Math.max(0,(ts-this.last)/1000)); this.last=ts; this.update(dt); this.draw(); this.raf=requestAnimationFrame(this.frame); }

  drawPool(ctx){
    const {W,H}=this, t=this.t, fl=this.fl, sy=this.surf, G=this.g;
    const wave=x=>sy+Math.sin(x*0.022+t*1.8)*2.6+Math.sin(x*0.061-t*1.2)*1.3;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(-10,H+10); for(let x=-10;x<=W+10;x+=6) ctx.lineTo(x,wave(x)); ctx.lineTo(W+10,H+10); ctx.closePath();
    const cg=ctx.createLinearGradient(0,sy-4,0,H); cg.addColorStop(0,tone(fl.pool[0],1.3)); cg.addColorStop(0.04,fl.pool[0]); cg.addColorStop(0.3,fl.pool[1]); cg.addColorStop(1,tone(fl.pool[2],0.55));
    ctx.fillStyle=cg; ctx.fill();
    ctx.clip();
    // 空の映りこみ（水面のすぐ下が明るい）
    const rg=ctx.createLinearGradient(0,sy,0,sy+H*0.05); rg.addColorStop(0,tone(fl.pool[0],1.5,.55)); rg.addColorStop(1,tone(fl.pool[0],1.2,0));
    ctx.fillStyle=rg; ctx.fillRect(0,sy-6,W,H*0.06);
    // 水面すぐ下の光るすじ（つや）
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineWidth=5; ctx.strokeStyle='rgba(255,200,150,.14)'; ctx.beginPath(); for(let x=-10;x<=W+10;x+=6){ const y=wave(x)+7+Math.sin(x*0.05+t)*1.5; x===-10?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();
    // スティックの映りこみ
    const s=this.idle?null:this.stick;
    if(s&&s.phase!=='enter'){ ctx.save(); ctx.globalAlpha=0.22; ctx.translate(G.x,sy); ctx.scale(1,-0.55); ctx.translate(0,-(G.restBottom+s.pos-sy));
      drawStick(ctx,G.L,s.type==='thin'?G.w*0.62:G.w,s.coat,s.type,null,t,s.seed,fl); ctx.restore(); }
    // ボスの映りこみ
    if(this.boss){ const bp=this.bossPos(), im=IMG['boss_'+this.boss.def.type]; if(imgOk(im)){ ctx.save(); ctx.globalAlpha=0.16; const sw=bp.size, sh=sw*im.naturalHeight/im.naturalWidth;
      ctx.translate(bp.x,sy); ctx.scale(1,-0.5); ctx.translate(0,-(bp.y-sy)); ctx.drawImage(im,-sw/2,-sh*0.56,sw,sh); ctx.restore(); } }
    // とろりと流れるつやのすじ
    ctx.globalCompositeOperation='screen';
    for(const gl of this.glints){
      const x=((gl.x+t*gl.v)%1.3+1.3)%1.3*W-W*0.15, y=sy+12+gl.d*(H-sy-20);
      const rw=W*gl.w*(1-gl.d*0.4), rh=4+gl.d*6;
      const g=ctx.createRadialGradient(x,y,0,x,y,rw); g.addColorStop(0,`rgba(255,215,175,${0.34-gl.d*0.2})`); g.addColorStop(0.25,`rgba(255,200,150,${0.16-gl.d*0.1})`); g.addColorStop(1,'rgba(255,200,150,0)');
      ctx.fillStyle=g; ctx.save(); ctx.translate(x,y); ctx.scale(1,rh/rw); ctx.translate(-x,-y); ctx.beginPath(); ctx.arc(x,y,rw,0,Math.PI*2); ctx.fill(); ctx.restore();
    }
    ctx.globalCompositeOperation='source-over';
    // 渦のすじ
    ctx.lineCap='round';
    for(let i=0;i<4;i++){
      const y0=sy+20+i*(H-sy)*0.2, ph=t*0.25+i*1.7;
      ctx.strokeStyle=tone(fl.pool[0],1.45,0.16-i*0.03); ctx.lineWidth=6-i;
      ctx.beginPath(); for(let x=-20;x<=W+20;x+=10){ const y=y0+Math.sin(x*0.012+ph)*6+Math.sin(x*0.031-ph*1.3)*3; x===-20?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke();
    }
    // 波紋
    for(const rp of this.ripples){ const k=rp.t; ctx.strokeStyle=`rgba(255,235,210,${0.5*(1-k)})`; ctx.lineWidth=2*(1-k)+0.5;
      ctx.beginPath(); ctx.ellipse(rp.x,sy+3,G.w*0.8+k*46,2.5+k*6,0,0,Math.PI*2); ctx.stroke(); }
    // 下に向かって暗く
    const vg=ctx.createLinearGradient(0,sy+40,0,H); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(10,2,0,.45)'); ctx.fillStyle=vg; ctx.fillRect(0,sy,W,H-sy);
    ctx.restore();
    // 水面のふち（光るライン）
    ctx.save(); ctx.lineWidth=2.2; ctx.strokeStyle='rgba(255,240,220,.6)'; ctx.beginPath(); for(let x=-10;x<=W+10;x+=6){ const y=wave(x); x===-10?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke();
    ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.beginPath(); for(let x=-10;x<=W+10;x+=6){ const y=wave(x)+3; x===-10?ctx.moveTo(x,y):ctx.lineTo(x,y); } ctx.stroke(); ctx.restore();
    // スティックのまわりのもり上がり
    if(s&&s.sub>0){ ctx.save(); const mw=G.w*1.6; const g=ctx.createRadialGradient(G.x,sy,1,G.x,sy,mw); g.addColorStop(0,tone(fl.pool[0],1.2,.9)); g.addColorStop(1,tone(fl.pool[0],1,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(G.x,sy,mw,5,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  }

  draw(){
    const ctx=this.ctx,{W,H}=this,G=this.g,t=this.t,fl=this.fl,fv=this.fever>0;
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.fillStyle='#0E1A10'; ctx.fillRect(0,0,W,H);
    ctx.save();
    if(this.shake>0){ ctx.translate((Math.random()-0.5)*this.shake,(Math.random()-0.5)*this.shake); }
    // 背景（画面いっぱいに）
    const bg=IMG.bg;
    if(imgOk(bg)){ const s=Math.max((W+16)/bg.naturalWidth,(H+16)/bg.naturalHeight); const bw=bg.naturalWidth*s, bh=bg.naturalHeight*s;
      ctx.drawImage(bg,(W-bw)/2,Math.min(0,(H-bh)*0.35)-8,bw,bh); }
    // 木もれ日のゆらぎ
    ctx.save(); ctx.globalCompositeOperation='screen';
    for(let i=0;i<3;i++){ const a=(fv?0.1:0.07)+0.03*Math.sin(t*0.7+i*2.1); const x0=W*(0.3+i*0.25)+Math.sin(t*0.2+i)*10;
      const g=ctx.createLinearGradient(x0,0,x0-W*0.3,H*0.8); g.addColorStop(0,`rgba(255,240,180,${a})`); g.addColorStop(1,'rgba(255,240,180,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(x0,0); ctx.lineTo(x0+W*0.09,0); ctx.lineTo(x0-W*0.18,H*0.8); ctx.lineTo(x0-W*0.34,H*0.8); ctx.closePath(); ctx.fill(); }
    // 舞う光のつぶ
    if(imgOk(IMG.star)) for(const m of this.motes){ m.y-=m.v*0.016*(fv?3:1); if(m.y<-0.05){ m.y=0.8; m.x=Math.random(); }
      const x=(m.x+Math.sin(t*0.5+m.p)*0.02)*W, y=m.y*H, s=4+m.s*5, a=0.35+0.3*Math.sin(t*2+m.p);
      ctx.globalAlpha=Math.max(0,a); ctx.drawImage(IMG.star,x-s,y-s,s*2,s*2); }
    ctx.restore(); ctx.globalAlpha=1;
    if(fv){ const g=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.3,W/2,H*0.45,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(255,200,80,0)'); g.addColorStop(1,`rgba(255,150,20,${0.22+0.08*Math.sin(t*8)})`); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }
    const fighting=this.boss&&this.boss.state==='fight';
    if(fighting&&!fv){ const g=ctx.createRadialGradient(W/2,H*0.45,Math.min(W,H)*0.3,W/2,H*0.45,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(120,0,20,0)'); g.addColorStop(1,`rgba(140,0,20,${0.4+0.1*Math.sin(t*4)})`); ctx.fillStyle=g; ctx.fillRect(0,0,W,H); }

    // ボス
    if(this.boss){ const b=this.boss, bp=this.bossPos(), im=IMG['boss_'+b.def.type];
      if(imgOk(im)){
        const sw=bp.size, sh=sw*im.naturalHeight/im.naturalWidth;
        // 泉に落ちる影
        ctx.save(); ctx.globalAlpha=0.35*(b.state==='down'?Math.max(0,1-b.downT):1); ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(bp.x,this.surf+4,sw*0.32,6,0,0,Math.PI*2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(bp.x,bp.y);
        const sq=Math.sin(t*4.4)*0.025; ctx.scale(1+sq,1-sq);
        if(b.hitT>0) ctx.rotate((Math.random()-0.5)*0.12);
        if(b.state==='down'){ const k=Math.min(1,b.downT/1.2); ctx.globalAlpha=1-k; ctx.rotate(k*2.2); ctx.scale(1+k*0.5,1+k*0.5); if(Math.random()<0.6) this.sparkle(bp.x+(Math.random()-0.5)*sw*0.6,bp.y+(Math.random()-0.5)*sw*0.6,3); }
        ctx.drawImage(im,-sw/2,-sh*0.56,sw,sh);
        if(b.hitT>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.min(1,b.hitT*4)*0.6; ctx.drawImage(im,-sw/2,-sh*0.56,sw,sh); }
        ctx.restore();
      } }

    // スティックとつりひも
    const s=this.idle?null:this.stick;
    if(s){
      const w=s.type==='thin'?G.w*0.62:G.w, bottom=G.restBottom+s.pos, top=bottom-G.L;
      ctx.save();
      const rope=ctx.createLinearGradient(G.x-2,0,G.x+2,0); rope.addColorStop(0,'#8A6A3A'); rope.addColorStop(0.5,'#E8D4A0'); rope.addColorStop(1,'#8A6A3A');
      ctx.fillStyle=rope; ctx.fillRect(G.x-1.5,-10,3,top-4);
      // 金のクリップ
      const cg=ctx.createLinearGradient(0,top-14,0,top+4); cg.addColorStop(0,'#FFF2B0'); cg.addColorStop(0.45,'#FFC83A'); cg.addColorStop(1,'#A8640E');
      ctx.fillStyle=cg; rr(ctx,G.x-w/2-6,top-14,w+12,16,5); ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#6A3A06'; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.6)'; rr(ctx,G.x-w/2-3,top-12,w+6,4,2); ctx.fill();
      ctx.restore();
      ctx.save(); if(s.type==='gold'){ ctx.shadowColor='rgba(255,213,120,0.95)'; ctx.shadowBlur=18+8*Math.sin(t*6); }
      ctx.shadowColor=ctx.shadowColor||'transparent';
      ctx.translate(G.x,bottom); drawStick(ctx,G.L,w,s.coat,s.type,s.phase!=='enter'?s.target:null,t,s.seed,fl,s.tAlpha); ctx.restore();
      if(s.type!=='normal'&&s.phase!=='enter'){
        const lab=s.type==='thin'?'極細 ×2':'金 ×3', lx=G.x+w/2+22, ly=top+30;
        ctx.save(); ctx.font=`900 13px ${FONT_UI}`; const tw=ctx.measureText(lab).width+18;
        const g=ctx.createLinearGradient(0,ly-12,0,ly+12); if(s.type==='thin'){ g.addColorStop(0,'#FFFFFF'); g.addColorStop(1,'#E8D8C0'); } else { g.addColorStop(0,'#FFF2A8'); g.addColorStop(1,'#FFB21E'); }
        ctx.fillStyle=g; rr(ctx,lx-6,ly-12,tw,24,12); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='#3A1406'; ctx.stroke();
        ctx.fillStyle='#3A1406'; ctx.textBaseline='middle'; ctx.fillText(lab,lx+3,ly+1); ctx.restore();
      }
    }
    for(const f of this.flyers) if(f.kind==='sink'){ ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,f.life)); ctx.translate(f.x,f.y); ctx.rotate(f.rot*0.3); drawStick(ctx,f.L,f.w,f.coat,f.type,null,t,f.seed,fl); ctx.restore(); }

    this.drawPool(ctx);

    // しずく・きらきら・コイン
    for(const p of this.particles){ const a=Math.max(0,Math.min(1,p.life*1.6)); ctx.globalAlpha=a;
      if(p.coin){ ctx.save(); ctx.translate(p.x,p.y); ctx.scale(Math.cos(p.spin),1); const g=ctx.createRadialGradient(-p.r*0.3,-p.r*0.3,0,0,0,p.r); g.addColorStop(0,'#FFF8C8'); g.addColorStop(0.6,'#FFC83A'); g.addColorStop(1,'#B8700E');
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,p.r,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#7A4206'; ctx.lineWidth=1; ctx.stroke(); ctx.restore(); }
      else if(p.star){ if(imgOk(IMG.star)){ const s2=p.r*3.2; ctx.drawImage(IMG.star,p.x-s2,p.y-s2,s2*2,s2*2); } }
      else { ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); ctx.fillStyle='rgba(255,240,220,.7)'; ctx.beginPath(); ctx.arc(p.x-p.r*0.35,p.y-p.r*0.35,p.r*0.32,0,Math.PI*2); ctx.fill(); } }
    ctx.globalAlpha=1;
    for(const f of this.flyers) if(f.kind==='fly'){
      const e=ease(Math.min(1,f.t)), x=f.x0+(W*0.78-f.x0)*e, y=f.y0+(this.top-20-f.y0)*e-Math.sin(e*Math.PI)*H*0.1;
      ctx.save(); ctx.globalAlpha=1-e*0.5; ctx.translate(x,y); ctx.rotate(-0.9*e); const sc=1-0.65*e; ctx.scale(sc,sc); drawStick(ctx,f.L,f.w,f.coat,f.type,null,t,f.seed,fl); ctx.restore(); }

    // つけ具合メーター（左・ガラスの管）
    if(s){
      const gw=18, gx=Math.max(22,W*0.06), gy=this.stickTop()+10, gh=Math.max(80,G.restBottom-gy-30), ta=s.tAlpha;
      ctx.save();
      ctx.fillStyle='rgba(20,8,4,.6)'; rr(ctx,gx-7,gy-30,gw+14,gh+64,14); ctx.fill();
      const tg=ctx.createLinearGradient(gx,0,gx+gw,0); tg.addColorStop(0,'rgba(255,255,255,.08)'); tg.addColorStop(0.5,'rgba(255,255,255,.18)'); tg.addColorStop(1,'rgba(255,255,255,.05)');
      ctx.fillStyle=tg; rr(ctx,gx,gy,gw,gh,9); ctx.fill();
      const Y=v=>gy+gh-v*gh;
      ctx.save(); rr(ctx,gx,gy,gw,gh,9); ctx.clip();
      ctx.globalAlpha=ta;
      ctx.fillStyle='rgba(255,200,60,.28)'; ctx.fillRect(gx,Y(Math.min(1,s.target+0.08)),gw,gh*0.16);
      ctx.shadowColor='rgba(255,210,80,.9)'; ctx.shadowBlur=8; ctx.fillStyle='#FFD23C'; ctx.fillRect(gx,Y(s.target+0.03),gw,gh*0.06); ctx.shadowBlur=0;
      ctx.globalAlpha=1;
      const cur=Math.max(0,Math.min(1,s.sub||0));
      const cg=ctx.createLinearGradient(gx,0,gx+gw,0); cg.addColorStop(0,tone(fl.pool[1],0.6)); cg.addColorStop(0.35,tone(fl.pool[1],1.25)); cg.addColorStop(1,tone(fl.pool[1],0.7));
      ctx.fillStyle=cg; ctx.fillRect(gx+3,Y(cur),gw-6,cur*gh);
      ctx.restore();
      ctx.fillStyle='rgba(255,255,255,.35)'; rr(ctx,gx+3,gy+6,3,gh-12,2); ctx.fill();
      if(s.coat>0){ ctx.fillStyle='#fff'; ctx.fillRect(gx-4,Y(s.coat)-1.5,gw+8,3); }
      ctx.lineWidth=2; ctx.strokeStyle='rgba(255,240,220,.55)'; rr(ctx,gx,gy,gw,gh,9); ctx.stroke();
      ctx.fillStyle='#FFE9B0'; ctx.font=`900 10px ${FONT_UI}`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('つけ具合',gx+gw/2,gy-16); ctx.fillText('目標',gx+gw/2,gy+gh+12);
      ctx.font=`900 15px ${FONT_UI}`; ctx.fillStyle='#FFD23C'; ctx.fillText(ta<0.3?'？':Math.round(s.target*100)+'%',gx+gw/2,gy+gh+27);
      ctx.restore();
    }

    // ボスの体力
    if(this.boss&&this.boss.state!=='escape'){ const b=this.boss, bw=Math.min(W*0.66,300), bx=W/2-bw/2, by=this.top+4, k=b.hp/b.max;
      ctx.save();
      ctx.fillStyle='rgba(20,6,4,.8)'; rr(ctx,bx-6,by,bw+12,38,14); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,200,120,.45)'; ctx.stroke();
      ctx.font=`900 12px ${FONT_UI}`; ctx.textBaseline='middle'; ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText('ボス　'+b.def.name,bx+4,by+11);
      ctx.textAlign='right'; ctx.fillStyle='#FFE9B0'; ctx.fillText(b.state==='fight'?`のこり ${Math.max(0,Math.ceil(b.dur-b.t))}秒`:'',bx+bw-4,by+11);
      ctx.fillStyle='rgba(255,255,255,.12)'; rr(ctx,bx,by+20,bw,12,6); ctx.fill();
      const hg=ctx.createLinearGradient(0,by+20,0,by+32); hg.addColorStop(0,'#FF9A8A'); hg.addColorStop(0.5,'#F0303A'); hg.addColorStop(1,'#A8121C');
      ctx.fillStyle=hg; rr(ctx,bx,by+20,Math.max(0.01,bw*k),12,6); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.45)'; rr(ctx,bx+3,by+21.5,Math.max(0.01,bw*k-6),3,2); ctx.fill();
      ctx.restore(); }

    // スロット（泉の中・左寄り）
    const S=this.slot;
    if(S){
      const cell=Math.min(56,W*0.15), pw=cell*3+24, ph=cell+20, px=Math.max(W*0.04,W*0.4-pw/2), py=Math.min(H-ph-10-(this.botInset||0),G.base+12);
      const hot=S.reach&&!S.stopped[2];
      ctx.save();
      ctx.shadowColor=hot?(S.r[0]===4?'rgba(255,214,102,1)':'rgba(255,90,70,1)'):'rgba(0,0,0,.5)'; ctx.shadowBlur=hot?22+10*Math.sin(t*20):12; ctx.shadowOffsetY=hot?0:5;
      const cab=ctx.createLinearGradient(0,py,0,py+ph); cab.addColorStop(0,'#FF5A5A'); cab.addColorStop(0.5,'#D8202A'); cab.addColorStop(1,'#7E0A16');
      ctx.fillStyle=cab; rr(ctx,px,py,pw,ph,16); ctx.fill(); ctx.restore();
      const fr=ctx.createLinearGradient(0,py,0,py+ph); fr.addColorStop(0,'#FFF2B0'); fr.addColorStop(0.5,'#FFC83A'); fr.addColorStop(1,'#A8640E');
      ctx.lineWidth=3.5; ctx.strokeStyle=hot?`hsl(${(t*600)%360},95%,65%)`:fr; rr(ctx,px,py,pw,ph,16); ctx.stroke();
      for(let i=0;i<3;i++){
        const cx=px+12+cell*i+cell/2, cy=py+10+cell/2;
        ctx.save(); rr(ctx,cx-cell/2+3,cy-cell/2,cell-6,cell,10); ctx.clip();
        const rg=ctx.createLinearGradient(0,cy-cell/2,0,cy+cell/2); rg.addColorStop(0,'#CDBFA8'); rg.addColorStop(0.25,'#FFFFFF'); rg.addColorStop(0.75,'#FFFFFF'); rg.addColorStop(1,'#CDBFA8');
        ctx.fillStyle=rg; ctx.fillRect(cx-cell/2,cy-cell/2,cell,cell);
        const off=S.off[i], idx=mod5(off), frac=off-Math.floor(off);
        for(const [k,dy] of [[idx,frac*cell],[(idx+1)%5,(frac-1)*cell]]){ ctx.save(); ctx.translate(cx,cy+dy); drawSymbol(ctx,k,cell*0.78,fl); ctx.restore(); }
        if(!S.stopped[i]){ ctx.fillStyle='rgba(255,255,255,.3)'; ctx.fillRect(cx-cell/2,cy-cell/2,cell,cell); }
        const sh=ctx.createLinearGradient(0,cy-cell/2,0,cy+cell/2); sh.addColorStop(0,'rgba(0,0,0,.25)'); sh.addColorStop(0.2,'rgba(0,0,0,0)'); sh.addColorStop(0.8,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,.25)');
        ctx.fillStyle=sh; ctx.fillRect(cx-cell/2,cy-cell/2,cell,cell);
        ctx.restore();
      }
      if(S.done&&S.win){ ctx.save(); ctx.strokeStyle=`rgba(255,240,140,${0.6+0.4*Math.sin(t*20)})`; ctx.lineWidth=4; ctx.shadowColor='#FFD23C'; ctx.shadowBlur=12; ctx.beginPath(); ctx.moveTo(px+14,py+10+cell/2); ctx.lineTo(px+pw-14,py+10+cell/2); ctx.stroke(); ctx.restore(); }
    }

    // カットイン（リボン）
    for(const b of this.banners){
      const p=1-b.life/b.max, inT=0.12, outT=0.85;
      const sx=p<inT?W*(1-ease(p/inT)):(p>outT?-W*((p-outT)/(1-outT)):0);
      const hgt=b.big?90:66, by=H*0.44;
      ctx.save(); ctx.translate(sx,0);
      ctx.save(); ctx.transform(1,-0.05,0,1,0,W*0.025);
      const rg=ctx.createLinearGradient(0,by-hgt/2,0,by+hgt/2); rg.addColorStop(0,'#FF6A5A'); rg.addColorStop(0.5,'#D8202A'); rg.addColorStop(1,'#8A0A16');
      ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=16; ctx.shadowOffsetY=6;
      ctx.fillStyle=rg; ctx.fillRect(-30,by-hgt/2,W+60,hgt); ctx.shadowColor='transparent';
      const gg=ctx.createLinearGradient(0,0,W,0); gg.addColorStop(0,'#A8640E'); gg.addColorStop(0.5,'#FFF2B0'); gg.addColorStop(1,'#A8640E');
      ctx.fillStyle=gg; ctx.fillRect(-30,by-hgt/2,W+60,4); ctx.fillRect(-30,by+hgt/2-4,W+60,4);
      ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(-30,by-hgt/2+4,W+60,hgt*0.3);
      ctx.restore();
      let fs=b.big?38:30; ctx.font=`900 ${fs}px ${FONT_UI}`; while(ctx.measureText(b.text).width>W-30&&fs>16){ fs-=2; ctx.font=`900 ${fs}px ${FONT_UI}`; }
      gameText(ctx,b.text,W/2,b.sub?by-11:by,fs,'gold');
      if(b.sub){ let ss=14; ctx.font=`900 ${ss}px ${FONT_UI}`; while(ctx.measureText(b.sub).width>W-30&&ss>9){ ss--; ctx.font=`900 ${ss}px ${FONT_UI}`; }
        ctx.fillStyle='#FFF4DC'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(b.sub,W/2,by+hgt/2-17); }
      ctx.restore();
    }

    // 判定の文字（スティックより上）
    for(const p of this.popups){
      const age=p.max-p.life, a=Math.min(1,p.life/Math.min(0.3,p.max)), pop=age<0.12?0.6+age/0.12*0.6:(age<0.22?1.2-(age-0.12)/0.1*0.2:1);
      ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.scale(pop,pop);
      gameText(ctx,p.text,0,0,p.size,p.style||'gold'); ctx.restore();
    }
    // お知らせ
    let ty=this.top+(this.boss&&this.boss.state!=='escape'?46:6);
    for(const b of this.toasts.slice(-3)){
      const a=Math.min(1,b.life*3,(b.max-b.life)*6);
      ctx.save(); ctx.globalAlpha=Math.max(0,a); ctx.font=`900 13px ${FONT_UI}`; ctx.textAlign='center'; ctx.textBaseline='middle';
      const tw=ctx.measureText(b.text).width+28; ctx.fillStyle='rgba(30,10,4,.82)'; rr(ctx,W/2-tw/2,ty,tw,26,13); ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle='rgba(255,200,90,.7)'; ctx.stroke();
      ctx.fillStyle=b.color; ctx.fillText(b.text,W/2,ty+13.5); ctx.restore(); ty+=30;
    }
    ctx.restore();
    if(this.flash>0){ ctx.setTransform(this.dpr,0,0,this.dpr,0,0); ctx.fillStyle=`rgba(${this.flashCol},${Math.min(0.45,this.flash*0.7)})`; ctx.fillRect(0,0,W,H); }
  }
}

</script>
<script>
/* ================= 画面（React） ================= */
const { useState, useEffect, useRef } = React;
const h = React.createElement;
const fmt=n=>Number(n||0).toLocaleString('ja-JP');
const Ic=(k,cls)=>h('img',{src:IMG_SRC['ic_'+k],alt:'',className:cls,draggable:false});

function Sheet({title,icon,onClose,children,center}){
  return h('div',{className:'sheetbg',onClick:e=>{ if(e.target===e.currentTarget) onClose(); }},
    h('div',{className:'sheet'+(center?' center':''),role:'dialog','aria-label':title},
      h('div',{className:'sheethead'},h('span',{className:'ribbon'},icon&&Ic(icon),title),h('button',{className:'close',onClick:onClose,'aria-label':'閉じる'},'×')),
      h('div',{className:'sheetbody'},children)));
}

function RankBody({store,initTab,refreshKey}){
  const online=Online.enabled();
  const [tab,setTab]=useState(initTab||(online?'daily':'local'));
  const [list,setList]=useState(null), [err,setErr]=useState('');
  useEffect(()=>{
    if(tab==='local'||!online){ setList([]); return; }
    let alive=true; setList(null); setErr('');
    Online.top(COLL[tab]()).then(l=>{ if(alive) setList(l); }).catch(()=>{ if(alive){ setErr('通信できませんでした。電波のよい場所でもう一度開いてください。'); setList([]); } });
    return ()=>{ alive=false; };
  },[tab,refreshKey]);
  const tabs=[['daily','今日のお題'],['week','今週'],['all','総合'],['local','この端末']];
  let body;
  if(tab==='local'){
    body=store.rank.length? h('ol',{className:'rlist'},store.rank.map((e,i)=>h('li',{key:e.id||i},h('span',{className:'pos'},i+1),h('span',{className:'nm'},e.name,h('small',null,e.date)),h('span',{className:'sc'},fmt(e.score)))))
      : h('p',{className:'empty'},'まだ記録がありません');
  } else if(!online) body=h('p',{className:'note'},'全国ランキングは準備中です。');
  else if(list===null) body=h('p',{className:'empty'},'読みこみ中…');
  else if(err) body=h('p',{className:'empty'},err);
  else if(!list.length) body=h('p',{className:'empty'},tab==='daily'?'今日はまだ誰も挑戦していません。一番乗りのチャンス！':'まだ記録がありません。最初の1位をとろう！');
  else body=h('ol',{className:'rlist'},list.map((e,i)=>h('li',{key:e.id,className:e.id===store.pid?'me':''},h('span',{className:'pos'},i+1),
      h('span',{className:'nm'},e.name,h('small',null,`レベル${e.lv}・最大${e.combo}コンボ`)),h('span',{className:'sc'},fmt(e.score)))));

function Result({r,store,onRetry,onHome,openSheet}){

  const period=r.mode==='daily'?'daily':'week';
  useEffect(()=>{
    let raf, t0=performance.now(), last=0; const dur=Math.min(1800,600+r.score/8);
    const step=(ts)=>{ const k=Math.min(1,(ts-t0)/dur), v=Math.round(r.score*(1-Math.pow(1-k,3))); setN(v);
      if(ts-last>55 && k<1){ last=ts; Snd.countTick(); }
      if(k<1) raf=requestAnimationFrame(step); else setStage(1); };
    raf=requestAnimationFrame(step); return ()=>cancelAnimationFrame(raf);
  },[]);
  useEffect(()=>{
    const s=loadStore(); const keys={all:'all',week:'w'+weekKey(),daily:'q'+dayKey()};
    const periods=r.mode==='daily'?['daily','week','all']:['week','all'];
    const changed={}; periods.forEach(p=>{ if(!(s.bests[keys[p]]>=r.score)){ s.bests[keys[p]]=r.score; changed[p]=true; } });
    saveStore(s);
    if(!Online.enabled()) return;
    const d={name:displayName(s),score:r.score,lv:La.lv,combo:r.run.maxCombo};
    (async()=>{
      try{
        await Promise.all(Object.keys(changed).map(p=>Online.submit(COLL[p](),s.pid,{...d,score:s.bests[keys[p]]})));
        const best=s.bests[keys[period]];
        const [above,total]=await Promise.all([Online.count(COLL[period](),best),Online.count(COLL[period]())]);
        setNet({pos:above+1,total});
      }catch(e){ setNet({err:true}); }
    })();
  },[]);
  useEffect(()=>{ if(stage!==1) return;
    if(r.localPos===1||(net&&net.pos<=3)) Snd.rankIn(); else if(r.isBest) Snd.milestone();
    const tm=setTimeout(()=>{ setStage(2); if(leveled) setTimeout(()=>Snd.levelUp(),700); },700);
    return ()=>clearTimeout(tm); },[stage]);
  const emo=r.judges.slice(0,15).map(j=>j==='perfect'?'🟨':j==='good'?'🟫':'⬜').join('');
  const share=async()=>{
    const url=location.href.startsWith('http')?location.href.split('#')[0]:'';
    const dk=dayKey();
    const head=r.mode==='daily'?`チョコディップ 今日のお題（${+dk.slice(4,6)}/${+dk.slice(6)}）`:'チョコディップ';
    const text=`${head}\n${fmt(r.score)}点・称号「${rank}」\n${emo}\n最大${r.run.maxCombo}コンボ・ボス${r.run.bossKills}体撃破${net&&net.pos?`・全国${net.pos}位`:''}\nこれ超えられる？\n${url}`.trim();
    try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(text); setMsg('結果をコピーしました。LINEに貼りつけて送れます'); }catch(e){ setMsg(text); }
  };
  const pct=stage>=2?(La.cur/La.need*100):(Lb.lv<La.lv?0:Lb.cur/Lb.need*100);
  const S=store.stats;
  const near=ACH.filter(a=>!store.ach.includes(a.id)&&!a.secret).map(a=>({a,k:Math.min(1,a.val(S,La.lv)/a.goal)})).filter(x=>x.k<1).sort((x,y)=>y.k-x.k)[0];
  const nextF=FLAVORS.find(f=>f.lv>La.lv);
  let needXp=0; if(nextF){ needXp=La.need-La.cur; for(let l=La.lv+1;l<nextF.lv;l++) needXp+=xpNeed(l); }
  return h('div',{className:'result'},h('div',{className:'rcard'},
    h('div',{className:'rtitle'},h('span',{className:'ribbon'},Ic('crown'),r.mode==='daily'?'今日のお題 けっか':'けっか')),
    h('div',{className:'sheetbody',style:{paddingTop:12}},
      h('span',{className:'rank-badge'},Ic('medal'),'称号　'+rank),
      h('div',{className:'bigscore'},h('b',null,fmt(n)),h('small',null,'点',stage>=1&&r.isBest&&h('span',{className:'newbest'},'自己ベスト更新！'))),
      stage>=1&&net&&net.pos&&h('div',{className:'rankin'},`${period==='daily'?'今日のお題':'今週'} 全国 ${net.pos}位 / ${net.total}人中`),
      stage>=1&&!Online.enabled()&&r.localPos&&h('div',{className:'rankin'},`この端末で ${r.localPos}位！`),
      net&&net.err&&h('p',{className:'note'},'全国ランキングに送れませんでした。電波のよい場所でもう一度遊ぶと送られます。'),
      h('div',{className:'stats'},
        h('div',null,h('div',{className:'k'},'パーフェクト'),h('div',{className:'v p'},r.run.perfect)),
        h('div',null,h('div',{className:'k'},'最大コンボ'),h('div',{className:'v'},r.run.maxCombo)),
        h('div',null,h('div',{className:'k'},'ボス撃破'),h('div',{className:'v'},r.run.bossKills+'体')),
        h('div',null,h('div',{className:'k'},'グッド'),h('div',{className:'v'},r.run.good)),
        h('div',null,h('div',{className:'k'},'ミス'),h('div',{className:'v'},r.run.miss)),
        h('div',null,h('div',{className:'k'},'大当たり'),h('div',{className:'v'},r.run.jackpots+'回'))),
      h('div',{className:'xpbox'},
        h('div',{className:'xptop'},h('span',null,'レベル ',h('b',null,stage>=2?La.lv:Lb.lv)),h('span',null,'＋',fmt(r.xpGain),' 経験値')),
        h('div',{className:'xpbar'},h('i',{style:{width:pct+'%'}})),
        (r.streakBonus>0||r.daily1)&&h('span',{className:'bonus'},[r.streakBonus>0?`${r.streak}日連続ボーナス ＋${r.streakBonus}`:'',r.daily1?'今日のお題 初回2倍':''].filter(Boolean).join('・'))),
      stage>=2&&leveled&&h('div',{className:'lvup'},`レベルアップ！ レベル${La.lv}`,FLAVORS.filter(f=>f.lv>Lb.lv&&f.lv<=La.lv).length>0&&h('small',null,FLAVORS.filter(f=>f.lv>Lb.lv&&f.lv<=La.lv).map(f=>`${f.name}味が解放されました`).join('・'))),
      h('div',{className:'nexts'},
        !r.isBest&&r.prevBest>0&&h('span',null,'自己ベストまで あと ',h('b',null,fmt(r.prevBest-r.score+1)),' 点'),
        nextF&&h('span',null,`「${nextF.name}」味まで あと `,h('b',null,fmt(needXp)),' 経験値'),
        near&&h('span',null,`もうすぐ達成：${near.a.name}（${fmt(Math.min(near.a.goal,near.a.val(S,La.lv)))} / ${fmt(near.a.goal)}）`)),
      r.newAch.length>0&&h('p',{className:'cat'},`新しい実績 ${r.newAch.length}個`),
      r.newAch.length>0&&h('div',{className:'alist'},r.newAch.map(id=>{ const a=ACH.find(x=>x.id===id); return a&&h('div',{key:id,className:'arow new'},Ic(CAT_IC[a.cat]),h('div',null,h('div',{className:'an'},a.name),h('div',{className:'ad'},a.desc)),h('span',{className:'ap ok'},'達成')); })),
      h('div',{className:'rbtns'},
        h('button',{className:'cbtn yellow',onClick:()=>onRetry(r.mode)},h('span',{className:'main'},'もう一度')),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}},
          h('button',{className:'cbtn blue sm',onClick:share},h('span',{className:'main'},'友達に挑戦')),
          h('button',{className:'cbtn green sm',onClick:()=>openSheet('rank',period)},h('span',{className:'main'},'ランキング'))),
        msg&&h('p',{className:'toastline'},msg),
        h('button',{className:'textbtn',onClick:onHome},'ホームにもどる')))));
}

function Hud({hud,sound,toggleSound}){
  const fv=hud.fever>0, tp=Math.min(100,hud.time/GAME_TIME*100);
